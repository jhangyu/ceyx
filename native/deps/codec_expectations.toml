workflow = "linux_build.yml"

[linux-x86_64.expect]
"jpeg:encode" = 1
"jpeg:decode" = { value = 0, reason = "JPEG decode capability is deliberately 0 on every platform: the decode route uses libjpeg unconditionally, not the generic ceyx_still_decode_supports gate", owner = "N/A (deliberate, not a gap)" }
"webp:encode" = 1
"webp:decode" = 1
"heic:encode" = 1
"heic:decode" = 1
"avif:encode" = 1
"avif:decode" = 1
"jxl:encode" = 1
"jxl:decode" = 1

# WI-5: linux-x86_64 build capabilities. ICC=0 is itself the Linux-
# determinism fix: previously nothing installed, asserted or documented
# liblcms2-dev on this leg and FindLCMS2 silently degraded, so the prior ICC
# value here was a runner-image accident. The forced `ENABLE_LCMS=OFF` in
# tests.cmake is the explicit, mechanical statement replacing it.
[linux-x86_64.capabilities]
"ICC" = { value = 0, reason = "OQ-N4 option Z (user ruling 2026-09-12): ENABLE_LCMS forced OFF on all platforms. No ICC transform is reachable -- LibRaw's only lcms2 consumer is apply_profile(), called solely from dcraw_process(), which ceyx never calls; camera_profile is never set. Colour uses fixed matrices + DNG-SDK spaces.", owner = "OQ-N4" }
"OPENMP" = 1
"HEIF" = 1
"WEBP" = 1
"JXL" = 1
"RAW" = 1

