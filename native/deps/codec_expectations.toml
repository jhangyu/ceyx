# codec_expectations.toml -- the single reviewable table of per-leg codec
# capability expectations, replacing scattered hard-coded `--expect` flags in
# the CI workflows.
#
# Spec: docs/logs/2026-08-31/plan-ci-codec-integration.md, Task 2 (CI-T2).
# Vocabulary (format names, directions) is owned by
# native/scripts/codec_capability_probe.py's FORMATS / DIRECTIONS -- this file
# must never invent a format or direction name codec_capability_probe.py does
# not know.
#
# Schema, per leg table [<leg-id>]:
#   instrument = "capability-probe" | "configure-log" | "on-device" | "none (accepted gap)"
#   workflow   = "<filename>.yml"          -- the leg's OWN workflow file
#                                              under .github/workflows/. Required:
#                                              render_expectations.py --check (and
#                                              ci_conventions_check.py's C8) compare
#                                              this leg's expect table against ONLY
#                                              this file's --expect tokens, never the
#                                              union of every leg (round-2 should-fix
#                                              #3 -- a union comparison lets a leg
#                                              wired with the wrong vector hide behind
#                                              another leg's legitimate token).
#   [<leg-id>.expect]
#     "<format>:<direction>" = 1            -- a plain 1 needs no annotation.
#     "<format>:<direction>" = { value = 0, reason = "...", owner = "..." }
#                                            -- EVERY 0 must be a table with a
#                                               `reason` and an `owner` (the
#                                               task responsible for closing
#                                               the gap). A bare `0` integer is
#                                               rejected at load time -- see
#                                               render_expectations.load_ledger.
#
# This is what makes a flip a one-line edit in the same PR as the capability,
# and what stops an honest zero from being mistaken for an accepted
# permanent state (the round-4 ruling: "every honest-zero ledger entry
# carries reason + owning task").
#
# The ledger records what a leg SHOULD assert. It is never edited to match a
# red run: a red run means the capability or the expectation is wrong, and
# the fix (supplying the capability, or correcting the expectation with
# evidence) goes in the same PR either way.

[macos-arm64]
instrument = "capability-probe"
workflow = "macos_build.yml"
# SF2 fix (round-3 review): macos-arm64 and macos-x86_64 share ONE workflow
# file (a matrix job), each asserting a different vector for the same
# tokens (avif:*) in a different step. step_anchor pins render_expectations
# --check to scan only the ONE step whose `- name:` line contains this
# substring (see render_expectations._tokens_in_file), so the two legs'
# conflicting avif tokens in the same file cannot collide. Must match the
# step name in .github/workflows/macos_build.yml verbatim.
step_anchor = "native leg"
# WI-5 (S-E2): the build-capability step is a SEPARATE step from the codec
# step above, but its name also contains the substring "native leg" (so the
# two steps read side by side, per plan step 5.4) -- reusing step_anchor
# here would make _STEP_HEADER_RE's substring search match the codec step's
# header first (it appears earlier in the file) and clip the scan BEFORE the
# capability step's own tokens, exactly the SF2 hazard this file's step_anchor
# comment already documents, recurring one level down. A second, more
# specific anchor keeps the two steps distinguishable.
capabilities_step_anchor = "S-E2, native leg"

[macos-arm64.expect]
"jpeg:encode" = 1
"jpeg:decode" = { value = 0, reason = "JPEG decode capability is deliberately 0 on every platform: the decode route uses libjpeg unconditionally, not the generic ceyx_still_decode_supports gate", owner = "N/A (deliberate, not a gap)" }
"webp:encode" = 1
"webp:decode" = 1
"heic:encode" = 1
"heic:decode" = 1
"avif:encode" = 1
"avif:decode" = 1
"jxl:encode" = 1
"jxl:decode" = 1

# WI-5 (docs/logs/2026-09-12/platform-parity-plan.md step 5.3): the build
# capability surface -- what is compiled into the artifact, queried via
# ceyx_build_capabilities -- broader than codec formats. ICC=0 on every leg
# per OQ-N4 option Z (2026-09-12, user ruling): ENABLE_LCMS is forced OFF in
# native/cmake/tests.cmake. lcms2 is unreachable dead code -- its only
# consumer, LibRaw::apply_profile(), is reachable solely from
# dcraw_process(), which ceyx architecturally never calls, and only when
# imgdata.params.camera_profile is non-NULL, which ceyx never sets. Colour
# uses fixed matrices plus DNG-SDK colour spaces.
[macos-arm64.capabilities]
"ICC" = { value = 0, reason = "OQ-N4 option Z (user ruling 2026-09-12): ENABLE_LCMS forced OFF on all platforms. No ICC transform is reachable -- LibRaw's only lcms2 consumer is apply_profile(), called solely from dcraw_process(), which ceyx never calls; camera_profile is never set. Colour uses fixed matrices + DNG-SDK spaces.", owner = "OQ-N4" }
"OPENMP" = 1
"HEIF" = 1
"WEBP" = 1
"JXL" = 1
"RAW" = 1

# The macOS cross x86_64 leg cannot dlopen a cross-compiled artifact from the
# arm64 host process (F9): it keeps its configure-log-line assertion instead
# of calling codec_capability_probe.py.
[macos-x86_64]
instrument = "configure-log"
workflow = "macos_build.yml"
# SF2 fix (round-3 review): see macos-arm64's step_anchor comment above for
# the full rationale. Must match the step name in
# .github/workflows/macos_build.yml verbatim.
step_anchor = "cross leg"
# WI-5 (S-E2): see macos-arm64's capabilities_step_anchor comment above --
# same rationale, mirrored for the cross leg.
capabilities_step_anchor = "S-E2, cross leg"

[macos-x86_64.expect]
"jpeg:encode" = 1
"jpeg:decode" = { value = 0, reason = "JPEG decode capability is deliberately 0 on every platform: the decode route uses libjpeg unconditionally, not the generic ceyx_still_decode_supports gate", owner = "N/A (deliberate, not a gap)" }
"webp:encode" = 1
"webp:decode" = 1
"heic:encode" = 1
"heic:decode" = 1
# AVIF is a known gap on the macOS cross x86_64 leg (DP-8, honest zero);
# remedy is the committed-dylib -> release-fetch migration chain, owned by
# CI-T11 (out of round scope per the convergence contract's parking-lot).
"avif:encode" = { value = 0, reason = "macOS x86_64 cross leg AVIF gap (DP-8 honest zero); remedy is the committed-dylib to release-fetch migration", owner = "CI-T11" }
"avif:decode" = { value = 0, reason = "macOS x86_64 cross leg AVIF gap (DP-8 honest zero); remedy is the committed-dylib to release-fetch migration", owner = "CI-T11" }
"jxl:encode" = 1
"jxl:decode" = 1

# WI-5: macos-x86_64 cannot dlopen (same reason as its codec vector above),
# so this leg's build-capability step reads the configure log too.
[macos-x86_64.capabilities]
"ICC" = { value = 0, reason = "OQ-N4 option Z (user ruling 2026-09-12): ENABLE_LCMS forced OFF on all platforms. No ICC transform is reachable -- LibRaw's only lcms2 consumer is apply_profile(), called solely from dcraw_process(), which ceyx never calls; camera_profile is never set. Colour uses fixed matrices + DNG-SDK spaces.", owner = "OQ-N4" }
"OPENMP" = 1
"HEIF" = 1
"WEBP" = 1
"JXL" = 1
"RAW" = 1

[linux-x86_64]
