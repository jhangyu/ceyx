[windows-x86_64.capabilities]
"ICC" = { value = 0, reason = "OQ-N4 option Z (user ruling 2026-09-12): ENABLE_LCMS forced OFF on all platforms. No ICC transform is reachable -- LibRaw's only lcms2 consumer is apply_profile(), called solely from dcraw_process(), which ceyx never calls; camera_profile is never set. Colour uses fixed matrices + DNG-SDK spaces.", owner = "OQ-N4" }
"OPENMP" = 1
"HEIF" = 1
"WEBP" = 1
"JXL" = 1
"RAW" = 1

# Android has NO runnable capability instrument in CI at all (compile-only
# ruling 2026-08-31): the cross-compiled AArch64 .so cannot be dlopen'd from
# the x86_64 runner, and the emulator gate that would have run an on-device
# probe was removed. Every cell is an honest, permanently-accepted zero.
[android-arm64-v8a]
instrument = "none (accepted gap)"
workflow = "android_build.yml"

[android-arm64-v8a.expect]
"jpeg:encode" = { value = 0, reason = "no runnable instrument in CI: cross-compiled AArch64 artifact, no emulator (compile-only ruling 2026-08-31)", owner = "CI-T5" }
"jpeg:decode" = { value = 0, reason = "no runnable instrument in CI: cross-compiled AArch64 artifact, no emulator (compile-only ruling 2026-08-31)", owner = "CI-T5" }
"webp:encode" = { value = 0, reason = "no runnable instrument in CI: cross-compiled AArch64 artifact, no emulator (compile-only ruling 2026-08-31)", owner = "CI-T5" }
"webp:decode" = { value = 0, reason = "no runnable instrument in CI: cross-compiled AArch64 artifact, no emulator (compile-only ruling 2026-08-31)", owner = "CI-T5" }
"heic:encode" = { value = 0, reason = "no runnable instrument in CI: cross-compiled AArch64 artifact, no emulator (compile-only ruling 2026-08-31)", owner = "CI-T5" }
"heic:decode" = { value = 0, reason = "no runnable instrument in CI: cross-compiled AArch64 artifact, no emulator (compile-only ruling 2026-08-31)", owner = "CI-T5" }
"avif:encode" = { value = 0, reason = "no runnable instrument in CI: cross-compiled AArch64 artifact, no emulator (compile-only ruling 2026-08-31)", owner = "CI-T5" }
"avif:decode" = { value = 0, reason = "no runnable instrument in CI: cross-compiled AArch64 artifact, no emulator (compile-only ruling 2026-08-31)", owner = "CI-T5" }
"jxl:encode" = { value = 0, reason = "no runnable instrument in CI: cross-compiled AArch64 artifact, no emulator (compile-only ruling 2026-08-31)", owner = "CI-T5" }
"jxl:decode" = { value = 0, reason = "no runnable instrument in CI: cross-compiled AArch64 artifact, no emulator (compile-only ruling 2026-08-31)", owner = "CI-T5" }

# WI-5: android-arm64-v8a build capabilities. Honest zeros for the SAME
