# native/deps/manifest.toml -- third-party dependency manifest.
#
# Round 1 scope (see docs/logs/2026-08-30/Plan_build_rewrite.md, deliverable
# D1): the HEIF-chain components only -- kvazaar, libde265, aom, libheif.
#
# ROUND 2 (D1 remaining components, D11, D10's manifest half): libwebp,
# libjxl, LibRaw/RawSpeed3 (patched) and Halide are added below by M1.
# Values are TRANSCRIBED VERBATIM from:
#   - native/scripts/fetch_libwebp_dist.sh    (macOS/Linux only -- see note
#     on [component.libwebp] below; no live Windows acquisition script exists
#     today, only a historically-built committed dist, PROVENANCE.md at
#     native/third_party/libwebp-dist-windows/PROVENANCE.md)
#   - native/scripts/fetch_libjxl_dist.sh     (macOS/Linux only; Windows uses
#     a committed dist per native/cmake/jxl.cmake, no live fetch script)
#   - native/scripts/fetch_libraw_dist.sh     (all platforms; D10, the patch
#     APPLIER, is M3's file; this manifest only declares the patches DATA per
#     spec §4.5, which is D1's job)
#   - native/scripts/fetch_halide_v21_dist.sh (all platforms; download-only,
#     no cmake configure step, so no `[component.halide.cmake]` block exists)
# No version, hash, URL, revision or CMake option value has been changed from
# these scripts. Where a script does not cover a platform (libwebp/libjxl on
# Windows), no `source.windows` override is fabricated -- see each
# component's own comment.
#
# Schema: docs/logs/2026-08-30/Spec_build_rewrite.md §4.2-4.4. Values below
# are TRANSCRIBED VERBATIM from:
#   - native/scripts/fetch_heif_deps.sh                          (macOS/Linux)
#   - native/scripts/tmp/win_build_round6.sh                     (Windows;
#     `git show ci/ci-green-round6:native/scripts/build_heif_dist_windows.sh`,
#     read-only scratch dump, not a build artefact)
# No version, hash, URL or CMake option value has been changed. Where the two
# source scripts disagree, that would be reported as a finding rather than
# silently resolved -- no such disagreement was found for the four HEIF-stack
# components (all four version/SHA-256 pairs match exactly, K32).
#
# ROUND-1 HONESTY NOTE (read before editing `source.*.kind`): this manifest
# encodes the CURRENT self-built-everything state of the two scripts above.
# It does NOT yet encode the target hybrid split from Spec §3.2 (D5, owned by
# M2, round 2-3: libwebp and macOS/Linux libde265 move to vcpkg; aom bumps to
# 3.15.0). `manifest.toml` has a single owner (this file's header, and
# Plan §3's file-ownership table) -- M2 must request changes here rather than
# editing directly. Two components below carry `migration_pending = true`
# with a `reason` describing why they are self-built TODAY without yet
# claiming a permanent R-1a taxonomy reason for libde265/aom specifically:
#   - libde265: today self-built on every platform; Spec §3.2 resolves
#     macOS/Linux to `registry` and Windows stays self-built for a genuine
#     `feature` reason (three blockers, none version-related). Only the
#     Windows split is a permanent reason; the macOS/Linux self-build today is
#     a sequencing fact (D5 has not landed), not a durable R-1a reason.
#   - aom: today self-built at 3.12.1; Spec §3.2 resolves it to `registry`
#     bumped to 3.15.0 under Ruling 1, landed by M2 in its own commit
#     (OD-10). The self-build today is likewise sequencing, not durable.
# kvazaar (`absent` -- no registry port exists at any version) and libheif
# (`feature` -- no registry libheif offers a kvazaar HEVC-encoder feature at
# any version, only x265/GPL-2.0) ARE durable R-1a reasons and do not carry
# `migration_pending`.

# ---------------------------------------------------------------------------
[component.kvazaar]
role          = "hevc-encoder"
version       = "2.3.1"
linkage       = "static"
licence       = "BSD-3-Clause"
licence_files = ["COPYING*", "LICENSE*"]
# K25: the installed archive name differs by generator/platform; the real
# build (D3, fetch.py) resolves whichever of these actually exists on disk.
path_keys = ["CMAKE_INSTALL_PREFIX"]

  [component.kvazaar.source.default]
  kind   = "tarball"
  reason = "no vcpkg port and no conan-center recipe exists for kvazaar at any version (verified 2026-08-30: raw.githubusercontent.com/microsoft/vcpkg/master/ports/kvazaar/vcpkg.json -> 404; conan-center recipes/kvazaar/config.yml -> empty)"
  url    = "https://github.com/ultravideo/kvazaar/releases/download/v{version}/kvazaar-{version}.tar.gz"
  sha256 = "2510b8ecc2bf384bbc7b8fc2756bbfa8a8c173b57634c8dfdd8bea6733e56c46"

  [component.kvazaar.source.windows]
  # Not a registry-vs-self-built decision -- kvazaar stays self-built on every
  # platform. This overlay changes only the ACQUISITION MECHANISM: the release
  # tarball above is missing a file that the Windows configure needs.
  override_only = true
  kind   = "git"
  reason = "the v2.3.1 release tarball omits src/threadwrapper/src/pthread.cpp, which kvazaar's CMakeLists.txt unconditionally adds to the kvazaar target when WIN32 is true; the file exists in the tagged git tree but was excluded from the packaged tarball asset (observed in CI run 33307277766). macOS/Linux never hit this because WIN32 is false there; do not unify the fetch mechanism (handoff §B, K24)."
  repo   = "https://github.com/ultravideo/kvazaar.git"
  tag    = "v{version}"

  [component.kvazaar.cmake.base]
  CMAKE_BUILD_TYPE                = "Release"
  CMAKE_INSTALL_PREFIX            = "{dist}"
  BUILD_SHARED_LIBS               = "OFF"
  BUILD_TESTS                     = "OFF"

  [component.kvazaar.cmake.macos]
  # F2 fix (round-1 review): CMAKE_POSITION_INDEPENDENT_CODE is Unix-only --
  # it comes from fetch_heif_deps.sh's STATIC_DEP_ARGS (K15), which
  # win_build_round6.sh's own STATIC_DEP_ARGS (lines 168-177) does NOT
  # include. It was wrongly placed in cmake.base, which rendered it into the
  # Windows argv (a carrier-neutral-migration violation, not merely a stray
  # key). Lives in macos/linux overlays only, exactly as the two source
  # scripts do.
  CMAKE_POSITION_INDEPENDENT_CODE = "ON"
  CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"
  CMAKE_OSX_ARCHITECTURES     = "{arch.apple}"

  [component.kvazaar.cmake.linux]
  CMAKE_POSITION_INDEPENDENT_CODE = "ON"

  [component.kvazaar.cmake.windows]
  _generator                   = "Ninja"
  CMAKE_C_COMPILER             = "clang-cl"
  CMAKE_CXX_COMPILER           = "clang-cl"
  CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
  CMAKE_MSVC_RUNTIME_LIBRARY   = "MultiThreaded"
  # /clang:-mNNN target-feature flags: kvazaar's CMakeLists reads if(MSVC) as
  # "this is cl.exe, which accepts every intrinsic unconditionally"; clang-cl
  # sets MSVC=1 but is clang underneath and hard-errors without these (K12,
  # layer 2). CMAKE_C_FLAGS/CXX_FLAGS on the Windows configure line REPLACE
  # CMake's own MSVC defaults rather than appending -- kvazaar's Windows
  # configure passes no other flags, so there is nothing to restore here
  # (contrast with libde265 and libheif below, which DO need K13/K14/N16's
  # restored defaults).
  CMAKE_C_FLAGS   = ["/clang:-msse4.1", "/clang:-mavx2"]
  CMAKE_CXX_FLAGS = ["/clang:-msse4.1", "/clang:-mavx2"]

  [component.kvazaar.outputs]
  static_lib.candidates = ["lib/libkvazaar.a", "lib/kvazaar.lib", "lib/libkvazaar.lib"]
  static_lib.required   = true

# ---------------------------------------------------------------------------
[component.libde265]
role          = "hevc-decoder"
version       = "1.1.1"
linkage       = "shared"
licence       = "LGPL-3.0-or-later"
licence_files = ["COPYING*", "LICENSE*"]
path_keys     = ["CMAKE_INSTALL_PREFIX"]

  [component.libde265.source.default]
  # D5 LEG 2 LANDED for macOS/Linux (2026-08-31). `migration_pending` is gone
  # because the migration is no longer pending: fetch_heif_deps.sh's
  # build_libde265() no longer builds anything -- it COPIES the vcpkg-installed
  # dylib out of $CEYX_VCPKG_PREFIX into the dist and hard-fails when that
  # prefix is absent. The pin is the overlay port's own `version` field
  # (native/vcpkg/ports/libde265/vcpkg.json), which selects the exact source
  # tarball by SHA-512 in its portfile -- a stronger pin than an `overrides`
  # entry, and the reason no `overrides` entry exists (overlay ports bypass the
  # versions database entirely).
  #
  # `source.windows` below is UNCHANGED and keeps its durable `feature` reason:
  # build_heif_dist_windows.sh still builds libde265 from source there,
  # permanently, for the three blockers it records.
  kind    = "registry"
  version = "1.1.1"
  # A5.5: the two patches the overlay port applies, read at
  # native/vcpkg/ports/libde265/*.patch before being described here.
  reason  = "supplied by vcpkg at exactly 1.1.1 via the CEYX OVERLAY FORK native/vcpkg/ports/libde265 (its vcpkg.json `version` plus a SHA-512-pinned release tarball IS the pin; overlay ports bypass the versions database, so no `overrides` entry can apply). Spec_build_rewrite.md §3.2 resolves macOS/Linux to registry with no version change. The fork applies two patches, both required: (1) fix-linkage.patch rewrites the pkg-config `Libs.private` derivation -- upstream hard-codes -lc++/-lstdc++ behind a check_cxx_symbol_exists(_LIBCPP_VERSION) probe and appends a literal -lpthread; the patch derives the list from CMAKE_CXX_IMPLICIT_LINK_LIBRARIES minus the C set, uses ${CMAKE_THREAD_LIBS_INIT}, and drops THREADS_PREFER_PTHREAD_FLAG, so a consumer resolving libde265 through pkg-config does not inherit a wrong or duplicated C++ runtime; (2) fix-api-visibility.patch reorders the LIBDE265_API definition so defined(LIBDE265_STATIC_BUILD) yields an EMPTY macro BEFORE the Win32 dllexport/dllimport branch is considered, so a static build stops emitting __declspec"
  # Retained as HISTORY, not as an instruction: these are the exact bytes the
  # pre-D5 source build downloaded, and they let a reviewer confirm the overlay
  # port pins the SAME upstream release (its portfile's SHA-512 covers identical
  # bytes) rather than take it on trust. One live use survives: assemble() in
  # fetch_heif_deps.sh still fetches and verifies this tarball to vendor the
  # LGPL-3 licence file, which the copied dylib does not carry.
  historical_url    = "https://github.com/strukturag/libde265/releases/download/v{version}/libde265-{version}.tar.gz"
  historical_sha256 = "fd48a927e94ed74fc7ce8829d222b9d8599fcbfe8b6448ba66705babc56ab219"

  [component.libde265.source.windows]
  # This override IS a durable R-1a reason (`feature`) even after D5 lands:
  # Spec §3.2 "Why libde265 still splits by platform" lists three Windows-only
  # blockers, none of them version-related, so Windows never joins the
  # registry regardless of a future version bump.
  kind   = "tarball"
  reason = "feature: three Windows-only blockers make the vcpkg libde265 port unusable here -- (1) its portfile builds the dec265 tool via vcpkg_copy_tools, whose bundled getopt clone does not compile under clang-cl; (2) the port passes no /clang:-msse4.1, so libde265's if(MSVC) SIMD gap (layer 2) recurs inside the port where this manifest cannot reach it; (3) we need dynamic-library + static-CRT, a combination no built-in vcpkg triplet expresses (verified 2026-08-30 against ports/libde265/portfile.cmake)"
  url    = "https://github.com/strukturag/libde265/releases/download/v{version}/libde265-{version}.tar.gz"
  sha256 = "fd48a927e94ed74fc7ce8829d222b9d8599fcbfe8b6448ba66705babc56ab219"

  [component.libde265.cmake.base]
  CMAKE_BUILD_TYPE                       = "Release"
  CMAKE_INSTALL_PREFIX                   = "{dist}"
  BUILD_SHARED_LIBS                      = "ON"
  ENABLE_DECODER                         = "ON"
  ENABLE_ENCODER                         = "OFF"
  ENABLE_SDL                             = "OFF"
  ENABLE_SHERLOCK265                     = "OFF"
  ENABLE_INTERNAL_DEVELOPMENT_TOOLS      = "OFF"
  WITH_FUZZERS                           = "OFF"

  [component.libde265.cmake.macos]
  # CMAKE_INSTALL_NAME_DIR is Unix-only (dylib @rpath install name); the
  # Windows script never passes it (Windows has no equivalent concept), so it
  # lives in the macos/linux overlays rather than base to keep the Windows
  # argv verbatim-clean (no invented flag).
  CMAKE_INSTALL_NAME_DIR      = "@rpath"
  CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"
  CMAKE_OSX_ARCHITECTURES     = "{arch.apple}"

  [component.libde265.cmake.linux]
  CMAKE_INSTALL_NAME_DIR = "@rpath"

  [component.libde265.cmake.windows]
  _generator                   = "Ninja"
  CMAKE_C_COMPILER             = "clang-cl"
  CMAKE_CXX_COMPILER           = "clang-cl"
  CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
  CMAKE_MSVC_RUNTIME_LIBRARY   = "MultiThreaded"
  # K13/N16: CMAKE_C_FLAGS/CXX_FLAGS REPLACE (never append to) CMake's own
  # MSVC defaults, so -DWIN32/-D_WINDOWS/-EHsc/-GR are restored by hand here,
  # exactly as build_heif_dist_windows.sh does. Losing them silently disables
  # C++ exceptions/RTTI with no build error -- only a much later runtime
  # failure (N16). ENABLE_DECODER=OFF here gates ONLY the dec265 CLI tool
  # subdirectory, not the decode library itself (see the source script's own
  # comment); the library-level ENABLE_DECODER stays ON via cmake.base above
  # -- wait: base sets ENABLE_DECODER=ON, and the Windows override below sets
  # it OFF, which is an intentional additive OVERRIDE (permitted; §4.2 rule 1
  # forbids deletion, not override) transcribed verbatim from
  # build_heif_dist_windows.sh:293 (ENABLE_DECODER=OFF on Windows only).
  ENABLE_DECODER  = "OFF"
  CMAKE_C_FLAGS   = ["-DWIN32", "-D_WINDOWS", "/clang:-msse4.1"]
  CMAKE_CXX_FLAGS = ["-DWIN32", "-D_WINDOWS", "-EHsc", "-GR", "/clang:-msse4.1"]

  [component.libde265.outputs]
  shared_lib.candidates = ["lib/libde265.dylib", "lib/libde265.so", "bin/libde265.dll", "bin/de265.dll"]
  shared_lib.required   = true
  import_lib.candidates = ["lib/de265.lib", "lib/libde265.lib"]
  import_lib.required   = false

# ---------------------------------------------------------------------------
[component.aom]
role          = "av1-codec"
version       = "3.12.1"
linkage       = "static"
licence       = "BSD-2-Clause AND Alliance-for-Open-Media-Patent-License-1.0"
# PATENTS* is in the glob specifically for aom (K6): it carries the AOM
# Patent License 1.0 as a SEPARATE grant on top of BSD-2; LICENSE alone drops it.
licence_files = ["COPYING*", "LICENSE*", "PATENTS*"]
path_keys     = ["CMAKE_INSTALL_PREFIX"]

  [component.aom.source.default]
  kind              = "tarball"
  migration_pending = true
  reason            = "self-built at 3.12.1 TODAY (transcribed verbatim); Spec_build_rewrite.md §3.2/§6.5 resolves this to registry at 3.15.0 under Ruling 1, landed by M2 as an ISOLATED single-purpose commit (OD-10) after the rest of the migration proves green at unchanged versions -- this is a sequencing fact, not a durable R-1a reason, and manifest.toml must be updated by M1 on M2's request once D5 lands"
  url               = "https://storage.googleapis.com/aom-releases/libaom-{version}.tar.gz"
  sha256            = "9e9775180dec7dfd61a79e00bda3809d43891aee6b2e331ff7f26986207ea22e"

  [component.aom.cmake.base]
  CMAKE_BUILD_TYPE                       = "Release"
  CMAKE_INSTALL_PREFIX                   = "{dist}"
  BUILD_SHARED_LIBS                      = "OFF"
  ENABLE_TESTS                           = "OFF"
  ENABLE_EXAMPLES                        = "OFF"
  ENABLE_DOCS                            = "OFF"
  ENABLE_TOOLS                           = "OFF"
  CONFIG_AV1_ENCODER                     = "1"
  CONFIG_AV1_DECODER                     = "1"

  [component.aom.cmake.macos]
  # F2 fix (round-1 review): CMAKE_POSITION_INDEPENDENT_CODE is Unix-only
  # (fetch_heif_deps.sh's STATIC_DEP_ARGS, K15); win_build_round6.sh's own
  # STATIC_DEP_ARGS (lines 168-177) does not pass it. Wrongly in cmake.base
  # previously, which rendered it into the Windows argv.
  CMAKE_POSITION_INDEPENDENT_CODE = "ON"
  CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"
  CMAKE_OSX_ARCHITECTURES     = "{arch.apple}"
  # K16: forced ONLY on Darwin. aom's own aom_configure.cmake derives
  # AOM_TARGET_CPU from the HOST CMAKE_SYSTEM_PROCESSOR when unset, which
  # mismatches on a cross-arch build (e.g. cross-building x86_64 on an
  # Apple-silicon arm64 host). macOS uname -m vocabulary ("arm64"/"x86_64")
  # matches aom's own vocabulary 1:1 -- this is lucky string overlap, not
  # design (handoff §D) -- which is why arch_map.toml's aom_target_cpu field
  # exists as an explicit table instead of passing uname -m through directly.
  # Linux is deliberately NOT given this override: uname -m there returns
  # "aarch64", which aom normalises internally via a different branch: an
  # explicit override would not match aom's later string comparisons and
  # would silently break native Linux arm64 builds (K16, no Linux-arm64 CI
  # leg exists to prove otherwise -- do not generalise this by accident).
  AOM_TARGET_CPU = "{arch.aom_target_cpu}"

  [component.aom.cmake.linux]
  CMAKE_POSITION_INDEPENDENT_CODE = "ON"
  # No AOM_TARGET_CPU overlay on Linux -- see the note above (K16).

  [component.aom.cmake.windows]
  _generator                   = "Ninja"
  CMAKE_C_COMPILER             = "clang-cl"
  CMAKE_CXX_COMPILER           = "clang-cl"
  CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
  CMAKE_MSVC_RUNTIME_LIBRARY   = "MultiThreaded"
  # No AOM_TARGET_CPU override on Windows: the Windows dist is never
  # cross-built (x86_64-only runner), so the host-vs-target mismatch K16
  # documents does not arise there (transcribed verbatim -- the Windows
  # script does not pass this flag).

  [component.aom.outputs]
  static_lib.candidates = ["lib/libaom.a", "lib/aom.lib", "lib/libaom.lib"]
  static_lib.required   = true

# ---------------------------------------------------------------------------
[component.libheif]
role          = "heif-container"
version       = "1.23.2"
linkage       = "shared"
licence       = "LGPL-3.0-or-later"
licence_files = ["COPYING*", "LICENSE*"]
path_keys     = [
  "CMAKE_INSTALL_PREFIX", "CMAKE_PREFIX_PATH",
  "LIBDE265_INCLUDE_DIR", "LIBDE265_LIBRARY",
  "KVAZAAR_INCLUDE_DIR", "KVAZAAR_LIBRARY",
  "AOM_INCLUDE_DIR", "AOM_LIBRARY",
]
path_list_keys = ["CMAKE_IGNORE_PREFIX_PATH"]

  [component.libheif.source.default]
  kind   = "tarball"
  reason = "feature: no vcpkg or conan-center libheif port offers a kvazaar HEVC-encoder feature at ANY version -- both registries' only HEVC encoder option is x265 (vcpkg ports/libheif/vcpkg.json feature 'hevc' -> WITH_X265, licence GPL-2.0-or-later), which this project excludes by name (K3, WITH_X265=OFF). Not a version reason: bumping libheif to any future release does not add a kvazaar option (verified 2026-08-30)."
  url    = "https://github.com/strukturag/libheif/releases/download/v{version}/libheif-{version}.tar.gz"
  sha256 = "8bd5d41d19dc84536d118b04774709f244df6104ef66d623dad5fa4650143405"

  [component.libheif.cmake.base]
  CMAKE_BUILD_TYPE            = "Release"
  CMAKE_INSTALL_PREFIX        = "{dist}"
  BUILD_SHARED_LIBS           = "ON"
  CMAKE_PREFIX_PATH           = "{dist}"
  LIBDE265_INCLUDE_DIR        = "{dist}/include"
  WITH_LIBDE265               = "ON"
  WITH_LIBDE265_PLUGIN        = "OFF"
  ENABLE_PLUGIN_LOADING       = "OFF"
  WITH_X265                   = "OFF"
  WITH_X264                   = "OFF"
  WITH_KVAZAAR                = "ON"
  WITH_KVAZAAR_PLUGIN         = "OFF"
  KVAZAAR_INCLUDE_DIR         = "{dist}/include"
  WITH_UVG266                 = "OFF"
  WITH_VVDEC                  = "OFF"
  WITH_VVENC                  = "OFF"
  WITH_AOM_DECODER            = "ON"
  WITH_AOM_ENCODER            = "ON"
  WITH_AOM_DECODER_PLUGIN     = "OFF"
  WITH_AOM_ENCODER_PLUGIN     = "OFF"
  AOM_INCLUDE_DIR             = "{dist}/include"
  WITH_DAV1D                  = "OFF"
  WITH_SvtEnc                 = "OFF"
  WITH_RAV1E                  = "OFF"
  WITH_OpenH264_DECODER       = "OFF"
  WITH_FFMPEG_DECODER         = "OFF"
  WITH_JPEG_DECODER           = "OFF"
  WITH_JPEG_ENCODER           = "OFF"
  WITH_OpenJPEG_DECODER       = "OFF"
  WITH_OpenJPEG_ENCODER       = "OFF"
  WITH_OPENJPH_ENCODER        = "OFF"
  WITH_UNCOMPRESSED_CODEC     = "OFF"
  WITH_HEADER_COMPRESSION     = "OFF"
  WITH_LIBSHARPYUV            = "OFF"
  WITH_EXAMPLES               = "OFF"
  WITH_GDK_PIXBUF             = "OFF"
  WITH_REDUCED_VISIBILITY     = "ON"
  BUILD_TESTING               = "OFF"
  WITH_FUZZERS                = "OFF"

  [component.libheif.cmake.macos]
  CMAKE_INSTALL_NAME_DIR      = "@rpath"
  CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"
  CMAKE_OSX_ARCHITECTURES     = "{arch.apple}"
  # K20: libheif's FindAOM.cmake tries find_package(AOM CONFIG) FIRST, which
  # on a dev machine with `brew install aom` resolves Homebrew's shared
  # AOMConfig.cmake and never even consults the *_INCLUDE_DIR/*_LIBRARY hints
  # below -- a green build with zero aom_codec_* symbols merged in. macOS-only
  # because the trap is specific to Homebrew's default prefix search.
  CMAKE_IGNORE_PREFIX_PATH = ["/opt/homebrew", "/usr/local"]
  # Nominal/primary artefact names (K25 -- real resolution is D3/fetch.py's
  # actual-file-presence probe).
  LIBDE265_LIBRARY = "{dist}/lib/libde265.dylib"
  KVAZAAR_LIBRARY  = "{dist}/lib/libkvazaar.a"
  AOM_LIBRARY      = "{dist}/lib/libaom.a"

  [component.libheif.cmake.linux]
  CMAKE_INSTALL_NAME_DIR = "@rpath"
  LIBDE265_LIBRARY = "{dist}/lib/libde265.so"
  KVAZAAR_LIBRARY  = "{dist}/lib/libkvazaar.a"
  AOM_LIBRARY      = "{dist}/lib/libaom.a"

  [component.libheif.cmake.windows]
  _generator                   = "Ninja"
  CMAKE_C_COMPILER             = "clang-cl"
  CMAKE_CXX_COMPILER           = "clang-cl"
  CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
  CMAKE_MSVC_RUNTIME_LIBRARY   = "MultiThreaded"
  # K11/N9, layer 3: -DKVZ_STATIC_LIB belongs on LIBHEIF's compile, not
  # kvazaar's -- kvazaar.h assumes __declspec(dllimport) unless the CONSUMER
  # defines this, and kvazaar installs no CMake package config to propagate
  # the usage requirement automatically.
  # K13/K14/N16: CMAKE_C_FLAGS/CXX_FLAGS REPLACE CMake's own MSVC defaults, so
  # -DWIN32/-D_WINDOWS/-W3/-GR/-EHsc are restored by hand, exactly as
  # build_heif_dist_windows.sh does.
  # This dist is DECODE-ONLY on Windows: WITH_AOM_ENCODER/WITH_AOM_DECODER
  # stay ON per the source script (encoder+decoder both requested there);
  # only the tool-level ENABLE_DECODER override lives on libde265, not here.
  CMAKE_C_FLAGS         = ["-DWIN32", "-D_WINDOWS", "-W3", "-DKVZ_STATIC_LIB"]
  CMAKE_CXX_FLAGS       = ["-DWIN32", "-D_WINDOWS", "-W3", "-GR", "-EHsc", "-DKVZ_STATIC_LIB"]
  LIBDE265_LIBRARY      = "{dist}/lib/de265.lib"
  KVAZAAR_LIBRARY       = "{dist}/lib/kvazaar.lib"
  AOM_LIBRARY           = "{dist}/lib/aom.lib"
  BUILD_DOCUMENTATION   = "OFF"

  [component.libheif.outputs]
  shared_lib.candidates = ["lib/libheif.1.dylib", "lib/libheif.so.1", "bin/heif.dll"]
  shared_lib.required   = true
  import_lib.candidates = ["lib/heif.lib"]
  import_lib.required   = false

# ---------------------------------------------------------------------------
# ROUND 2 (M1): libwebp, libjxl, LibRaw/RawSpeed3, Halide.
# ---------------------------------------------------------------------------
[component.libwebp]
role          = "webp-codec"
version       = "1.6.0"
linkage       = "static"
licence       = "BSD-3-Clause"
licence_files = ["COPYING*"]
path_keys     = ["CMAKE_INSTALL_PREFIX"]

  [component.libwebp.source.default]
  # D5 LANDED for libwebp (2026-08-31). `migration_pending` is gone because the
  # migration is no longer pending: native/vcpkg/vcpkg.json declares libwebp and
  # pins it to exactly 1.6.0 via `overrides` (N30 — never the floating
  # baseline), the overlay triplets install it as a STATIC archive, and
  # native/cmake/encode.cmake resolves it with find_package(WebP CONFIG),
  # failing the configure hard if it is absent. fetch_libwebp_dist.sh, which
  # this block was transcribed from, is deleted in the same commit.
  #
  # `version` above (1.6.0) is what the registry resolves to; the schema
  # (manifest.py:166-175, A1.3) requires that pin to be explicit for
  # kind="registry" precisely so a future edit cannot let it float.
  kind    = "registry"
  version = "1.6.0"
  reason  = "supplied by vcpkg at exactly 1.6.0 (native/vcpkg/vcpkg.json `overrides`, resolved against pinned baseline abb6dda5cc32914d2e64d7d72b974dc301d1fc8a); Spec_build_rewrite.md §3.2 resolves this component to registry with no version change needed, and D5 landed that wiring on macOS/Linux -- Windows continues to use the committed dist described below, which no script in this repo has ever produced"
  # The self-built acquisition data is retained as HISTORY, not as an
  # instruction: these are the exact bytes fetch_libwebp_dist.sh downloaded, and
  # keeping them is what lets a reviewer confirm the registry build is the same
  # upstream release rather than take it on trust. Nothing reads them now that
  # `kind` is "registry".
  historical_url    = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-{version}.tar.gz"
  historical_sha256 = "e4ab7009bf0629fd11982d4c2aa83964cf244cffba7347ecd39019a9e38c4564"
  # No `source.windows` override: fetch_libwebp_dist.sh has no Windows branch.
  # The committed native/third_party/libwebp-dist-windows/ dist was built
  # once, by hand, by a since-deleted script
  # (build_libwebp_dist_windows.sh, per its own PROVENANCE.md:3-8) run on a
  # windows-latest GitHub Actions runner and is not reproduced by any script
  # in this repo today -- there is nothing live to transcribe for Windows, so
  # no `source.windows` block is fabricated here (red line: do not invent a
  # build step that does not exist).

  [component.libwebp.cmake.base]
  # Transcribed from fetch_libwebp_dist.sh:90-104. CMAKE_POSITION_INDEPENDENT_CODE
  # is unconditional here (unlike kvazaar/aom's F2 Unix-only placement) because
  # the source script passes it unconditionally, outside its Darwin-only
  # CMAKE_OSX_ARGS block (fetch_libwebp_dist.sh:82-94).
  CMAKE_BUILD_TYPE                = "Release"
  CMAKE_INSTALL_PREFIX            = "{dist}"
  CMAKE_POSITION_INDEPENDENT_CODE = "ON"
  BUILD_SHARED_LIBS               = "OFF"
  WEBP_BUILD_ANIM_UTILS            = "OFF"
  WEBP_BUILD_CWEBP                 = "OFF"
  WEBP_BUILD_DWEBP                 = "OFF"
  WEBP_BUILD_GIF2WEBP              = "OFF"
  WEBP_BUILD_IMG2WEBP              = "OFF"
  WEBP_BUILD_VWEBP                 = "OFF"
  WEBP_BUILD_WEBPINFO              = "OFF"
  WEBP_BUILD_WEBPMUX               = "OFF"
  WEBP_BUILD_EXTRAS                = "OFF"

  [component.libwebp.cmake.macos]
  CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"
  CMAKE_OSX_ARCHITECTURES     = "{arch.apple}"

  [component.libwebp.outputs]
  # WEBP_BUILD_WEBPMUX=OFF disables only the cwebp/dwebp/etc CLI tools; the
  # mux and demux LIBRARIES are built regardless (fetch_libwebp_dist.sh:118-120,
  # verbatim comment preserved -- "not a contract", asserted below).
  static_lib.candidates  = ["lib/libwebp.a", "lib/libwebp.lib"]
  static_lib.required    = true
  mux_lib.candidates     = ["lib/libwebpmux.a", "lib/libwebpmux.lib"]
  mux_lib.required       = true
  demux_lib.candidates   = ["lib/libwebpdemux.a", "lib/libwebpdemux.lib"]
  demux_lib.required     = true
  sharpyuv_lib.candidates = ["lib/libsharpyuv.a", "lib/libsharpyuv.lib"]
  sharpyuv_lib.required   = true

# ---------------------------------------------------------------------------
[component.libjxl]
role          = "jxl-codec"
# Note: NOT the plan's stated target v0.11.1 -- fetch_libjxl_dist.sh:27-29
# itself documents pinning v0.12.0 instead ("latest stable per GitHub API as
# of 2026-08-30 ... deviates from the plan's target v0.11.1, which the plan
# stated no reason to prefer over latest"). Transcribed verbatim, not
# reconciled -- a real finding, not a transcription choice (D1 red line).
version       = "0.12.0"
linkage       = "static"
licence       = "BSD-3-Clause"
licence_files = ["LICENSE*", "COPYING*"]
path_keys     = ["CMAKE_INSTALL_PREFIX"]

  [component.libjxl.source.default]
  kind       = "git"
  reason     = "downgrade: OD-9 ruled self-built -- vcpkg's libjxl versions database tops out at 0.11.2, below our pinned tag v0.12.0 (verified 2026-08-30); adopting the registry copy would ship an older JPEG-XL implementation, not merely a different one"
  repo       = "https://github.com/libjxl/libjxl.git"
  tag        = "v{version}"
  # Pin mechanism is commit-SHA based, not a tarball SHA-256: upstream has
  # never published a release asset that is a source tarball including the
  # third_party/highway and third_party/brotli submodules the static build
  # requires (fetch_libjxl_dist.sh:6-24, checked across every tag v0.6-v0.12.0
  # via the GitHub Releases API). The tag itself is the pin -- `git submodule
  # update --init` at a given tag deterministically resolves the submodule
  # SHAs the superproject recorded for that tag.
  submodules = ["third_party/brotli", "third_party/highway", "third_party/skcms"]
  # No `source.windows` override: fetch_libjxl_dist.sh has no Windows branch;
  # native/cmake/jxl.cmake:40-47 points WIN32 at a committed dist instead
  # (soft-degrades with message(WARNING) if absent, per jxl.cmake:13-18) --
  # nothing live to transcribe for Windows.

  [component.libjxl.cmake.base]
  CMAKE_BUILD_TYPE                = "Release"
  CMAKE_INSTALL_PREFIX            = "{dist}"
  CMAKE_POSITION_INDEPENDENT_CODE = "ON"
  BUILD_SHARED_LIBS               = "OFF"
  BUILD_TESTING                   = "OFF"
  JPEGXL_ENABLE_TOOLS             = "OFF"
  JPEGXL_ENABLE_BENCHMARK         = "OFF"
  JPEGXL_ENABLE_EXAMPLES          = "OFF"
  JPEGXL_ENABLE_FUZZERS           = "OFF"
  JPEGXL_ENABLE_DOXYGEN           = "OFF"
  JPEGXL_ENABLE_MANPAGES          = "OFF"
  JPEGXL_ENABLE_SJPEG             = "OFF"
  JPEGXL_ENABLE_OPENEXR           = "OFF"
  # JPEGXL_ENABLE_SKCMS=ON is REQUIRED, not a style choice: libjxl.a leaves
  # JxlGetDefaultCms undefined and only libjxl_cms.a (built because of this
  # flag) defines it -- an encode/decode consumer linking libjxl.a without
  # libjxl_cms.a fails at final link time, not at compile time
  # (fetch_libjxl_dist.sh:46-49; native/cmake/jxl.cmake:61-65 verbatim).
  JPEGXL_ENABLE_SKCMS              = "ON"
  JPEGXL_ENABLE_JNI                = "OFF"
  # FORCE_SYSTEM_*=OFF pins highway and brotli to the bundled submodule
  # copies recorded by `submodules` above -- a system copy would make that
  # pin a half-truth (fetch_libjxl_dist.sh:127-129 verbatim).
  JPEGXL_FORCE_SYSTEM_BROTLI       = "OFF"
  JPEGXL_FORCE_SYSTEM_HWY          = "OFF"

  [component.libjxl.cmake.macos]
  CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"
  CMAKE_OSX_ARCHITECTURES     = "{arch.apple}"

  [component.libjxl.outputs]
  # libjxl_cms.a is REQUIRED (see JPEGXL_ENABLE_SKCMS comment above), not
  # merely "the archive that happens to exist" (fetch_libjxl_dist.sh:46-50).
  static_lib.candidates       = ["lib/libjxl.a"]
  static_lib.required         = true
  cms_lib.candidates          = ["lib/libjxl_cms.a"]
  cms_lib.required            = true
  threads_lib.candidates      = ["lib/libjxl_threads.a"]
  threads_lib.required        = true
  hwy_lib.candidates          = ["lib/libhwy.a"]
  hwy_lib.required            = true
  brotlicommon_lib.candidates = ["lib/libbrotlicommon.a"]
  brotlicommon_lib.required   = true
  brotlidec_lib.candidates    = ["lib/libbrotlidec.a"]
  brotlidec_lib.required      = true
  brotlienc_lib.candidates    = ["lib/libbrotlienc.a"]
  brotlienc_lib.required      = true

# ---------------------------------------------------------------------------
[component.libraw]
role    = "raw-decoder"
# LibRaw ships no version tag at these pinned revisions (README.cmake); the
# manifest pin is the three git revisions below, not a semver (spec §4.5).
version = "df226ea4178ccd74245f4f13c23adddfa01411c9"
linkage = "static"
# Per native/third_party/libraw/PROVENANCE.md's table: "LGPL-2.1 (elected;
# CDDL-1.0 also offered upstream)" -- LibRaw dual-licenses and this project
# elects LGPL-2.1. RawSpeed3 is LGPL-2.1; LibRaw-cmake is MIT.
licence = "LGPL-2.1-only"
licence_files = ["LICENSE.LGPL", "LICENSE.CDDL"]
# No `cmake` block: LibRaw is add_subdirectory'd via the vendored
# LibRaw-cmake overlay directly into the main native build
# (fetch_libraw_dist.sh:16-19), not built as a standalone `cmake --install`
# dist the way the HEIF stack and libwebp/libjxl are -- there is no separate
# configure argv for render.py to produce here.

  [component.libraw.source.default]
  kind   = "git-multi"
  reason = "patched: ten project-authored patches (5 native/patches/libraw/*.patch, 5 native/patches/rawspeed3/*.patch) with a load-bearing apply order; no registry copy carries them (vcpkg libraw 0.22.1 and conan libraw 0.22.2 are both unpatched and a different version besides, verified 2026-08-30)"

    [[component.libraw.source.default.repos]]
    name = "libraw"
    url  = "https://github.com/LibRaw/LibRaw.git"
    rev  = "df226ea4178ccd74245f4f13c23adddfa01411c9"
    dest = "third_party/libraw"

    [[component.libraw.source.default.repos]]
    name = "rawspeed3"
    url  = "https://github.com/darktable-org/rawspeed.git"
    rev  = "c835b05aecfacb7343f7c424abd620aa12116c3f"
    dest = "third_party/libraw/RawSpeed3/rawspeed"

    [[component.libraw.source.default.repos]]
    name = "libraw-cmake"
    url  = "https://github.com/LibRaw/LibRaw-cmake.git"
    rev  = "eb98e4325aef2ce85d2eb031c2ff18640ca616d3"
    dest = "third_party/libraw-cmake"

  # Overlay REPLACES LibRaw's own in-tree RawSpeed3 patch directory wholesale
  # (not a merge): a patch dropped as upstream-fixed must stay dropped, never
  # resurrected by LibRaw's next re-clone (fetch_libraw_dist.sh:72-91, spec
  # §4.5 R-P5). Applied FIRST (list order is apply order, spec §4.5 R-P1).
  [[component.libraw.patches]]
  set  = "rawspeed3"
  from = "native/patches/rawspeed3"
  into = "third_party/libraw/RawSpeed3/patches"
  mode = "replace-directory"
  why  = "a patch dropped as upstream-fixed must stay dropped; merging would resurrect it (fetch_libraw_dist.sh:82-84)"

  # Applied AFTER the RawSpeed3 overlay above, rooted at the LibRaw tree
  # (fetch_libraw_dist.sh:129-145). Each patch's forward/reverse
  # apply-detection is D10/M3's applier (patches.py), not this manifest's
  # concern -- this block only declares WHAT to apply and in WHAT ORDER
  # (spec §4.5).
  [[component.libraw.patches]]
  set  = "libraw"
  from = "native/patches/libraw"
  root = "third_party/libraw"
  mode = "apply-in-order"
  why  = "project-authored; must apply AFTER LibRaw's own (overlaid) RawSpeed3 set (fetch_libraw_dist.sh:129-131)"

# ---------------------------------------------------------------------------
[component.halide]
role    = "aot-codegen"
version = "21.0.0"
# Halide is a prebuilt binary distribution consumed for ahead-of-time code
# generation, not a library ceyx links a source build of -- there is no
# `linkage` in the licence-compliance sense §4.4 defines for the HEIF stack.
linkage = "n/a (prebuilt binary distribution, download-only)"
licence = "MIT"
licence_files = ["LICENSE.txt"]
# No `cmake` block and no `path_keys`: fetch_halide_v21_dist.sh has no
# configure/build step at all -- it downloads a prebuilt archive and extracts
# it (fetch_halide_v21_dist.sh:71-96). Nothing for render.py to produce.

  [component.halide.source.default]
  kind   = "tarball"
  reason = "downgrade: OD-9 ruled self-built -- the vcpkg Halide port is 18.0.0, three major versions below our pinned v21.0.0 (verified 2026-08-30), and native/third_party/halide/VERSION's own abi_notes warn 'schedule changes break AOT artifacts; bump requires full regen' -- a downgrade here would invalidate every AOT artefact in the decode pipeline, not merely ship an older tool"
  # Same build commit backs every platform/arch asset (fetch_halide_v21_dist.sh:23-26,
  # "all share the same b629c80... build commit, so the ABI matches the pinned
  # version"), so this is the one hash-like pin recorded per component, not
  # per asset.
  commit = "b629c80de18f1534ec71fddd8b567aa7027a0876"
  # No published SHA-256 for these release assets -- fetch_halide_v21_dist.sh
  # itself performs no hash verification (verbatim gap, not introduced here;
  # flagged for D4/D6, not silently "fixed" by inventing a hash this manifest
  # cannot independently verify).
  url_template = "https://github.com/halide/Halide/releases/download/v{version}/Halide-{version}-{halide_platform}-{commit}.{ext}"

    # platform.arch -> {halide_platform, ext} asset-name components, verbatim
    # from fetch_halide_v21_dist.sh's case statement (:30-60). Windows is
    # included because, unlike libwebp/libjxl, Halide DOES run through this
    # fetch script on the Windows runner today (windows_build.yml:150) --
    # MSYS/Git-Bash's `uname` there reports "MINGW*"/x86_64, which the script's
    # case statement maps to the same canonical arch_map x86_64 spelling used
    # everywhere else in this manifest.
    [component.halide.source.default.assets]
    macos.arm64    = { halide_platform = "arm-64-osx",     ext = "tar.gz" }
    macos.x86_64   = { halide_platform = "x86-64-osx",     ext = "tar.gz" }
    linux.arm64    = { halide_platform = "arm-64-linux",   ext = "tar.gz" }
    linux.x86_64   = { halide_platform = "x86-64-linux",   ext = "tar.gz" }
    windows.x86_64 = { halide_platform = "x86-64-windows", ext = "zip" }

  [component.halide.outputs]
  # Windows ships an import library (Halide.lib); POSIX hosts a static
  # archive (fetch_halide_v21_dist.sh:65-69 verbatim).
  static_lib.candidates = ["lib/libHalide.a", "lib/Halide.lib"]
  static_lib.required   = true
