[component.libheif]
role          = "heif-container"
version       = "1.23.2"
linkage       = "shared"
licence       = "LGPL-3.0-or-later"
licence_files = ["COPYING*", "LICENSE*"]
path_keys     = [
  "CMAKE_INSTALL_PREFIX", "CMAKE_PREFIX_PATH",
  "LIBDE265_INCLUDE_DIR", "LIBDE265_LIBRARY",
  "KVAZAAR_INCLUDE_DIR", "KVAZAAR_LIBRARY",
  "AOM_INCLUDE_DIR", "AOM_LIBRARY",
]
path_list_keys = ["CMAKE_IGNORE_PREFIX_PATH"]

  [component.libheif.source.default]
  kind   = "tarball"
  reason = "feature: no vcpkg or conan-center libheif port offers a kvazaar HEVC-encoder feature at ANY version -- both registries' only HEVC encoder option is x265 (vcpkg ports/libheif/vcpkg.json feature 'hevc' -> WITH_X265, licence GPL-2.0-or-later), which this project excludes by name (K3, WITH_X265=OFF). Not a version reason: bumping libheif to any future release does not add a kvazaar option (verified 2026-08-30)."
  url    = "https://github.com/strukturag/libheif/releases/download/v{version}/libheif-{version}.tar.gz"
  sha256 = "8bd5d41d19dc84536d118b04774709f244df6104ef66d623dad5fa4650143405"

  [component.libheif.cmake.base]
  CMAKE_BUILD_TYPE            = "Release"
  CMAKE_INSTALL_PREFIX        = "{dist}"
  BUILD_SHARED_LIBS           = "ON"
  CMAKE_PREFIX_PATH           = "{dist}"
  LIBDE265_INCLUDE_DIR        = "{dist}/include"
  WITH_LIBDE265               = "ON"
  WITH_LIBDE265_PLUGIN        = "OFF"
  ENABLE_PLUGIN_LOADING       = "OFF"
  WITH_X265                   = "OFF"
  WITH_X264                   = "OFF"
  WITH_KVAZAAR                = "ON"
  WITH_KVAZAAR_PLUGIN         = "OFF"
  KVAZAAR_INCLUDE_DIR         = "{dist}/include"
  WITH_UVG266                 = "OFF"
  WITH_VVDEC                  = "OFF"
  WITH_VVENC                  = "OFF"
  WITH_AOM_DECODER            = "ON"
  WITH_AOM_ENCODER            = "ON"
  WITH_AOM_DECODER_PLUGIN     = "OFF"
  WITH_AOM_ENCODER_PLUGIN     = "OFF"
  AOM_INCLUDE_DIR             = "{dist}/include"
  WITH_DAV1D                  = "OFF"
  WITH_SvtEnc                 = "OFF"
  WITH_RAV1E                  = "OFF"
  WITH_OpenH264_DECODER       = "OFF"
  WITH_FFMPEG_DECODER         = "OFF"
  WITH_JPEG_DECODER           = "OFF"
  WITH_JPEG_ENCODER           = "OFF"
  WITH_OpenJPEG_DECODER       = "OFF"
  WITH_OpenJPEG_ENCODER       = "OFF"
  WITH_OPENJPH_ENCODER        = "OFF"
  WITH_UNCOMPRESSED_CODEC     = "OFF"
  WITH_HEADER_COMPRESSION     = "OFF"
  WITH_LIBSHARPYUV            = "OFF"
  WITH_EXAMPLES               = "OFF"
  WITH_GDK_PIXBUF             = "OFF"
  WITH_REDUCED_VISIBILITY     = "ON"
  BUILD_TESTING               = "OFF"
  WITH_FUZZERS                = "OFF"

  [component.libheif.cmake.macos]
  CMAKE_INSTALL_NAME_DIR      = "@rpath"
  CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"
  CMAKE_OSX_ARCHITECTURES     = "{arch.apple}"
  # K20: libheif's FindAOM.cmake tries find_package(AOM CONFIG) FIRST, which
  # on a dev machine with `brew install aom` resolves Homebrew's shared
  # AOMConfig.cmake and never even consults the *_INCLUDE_DIR/*_LIBRARY hints
  # below -- a green build with zero aom_codec_* symbols merged in. macOS-only
  # because the trap is specific to Homebrew's default prefix search.
  CMAKE_IGNORE_PREFIX_PATH = ["/opt/homebrew", "/usr/local"]
  # Nominal/primary artefact names (K25 -- real resolution is D3/fetch.py's
  # actual-file-presence probe).
  LIBDE265_LIBRARY = "{dist}/lib/libde265.dylib"
  KVAZAAR_LIBRARY  = "{dist}/lib/libkvazaar.a"
  AOM_LIBRARY      = "{dist}/lib/libaom.a"

  [component.libheif.cmake.linux]
  CMAKE_INSTALL_NAME_DIR = "@rpath"
  LIBDE265_LIBRARY = "{dist}/lib/libde265.so"
  KVAZAAR_LIBRARY  = "{dist}/lib/libkvazaar.a"
  AOM_LIBRARY      = "{dist}/lib/libaom.a"

  [component.libheif.cmake.android]
  # A-T4, D1 option 1 (full parity) + D2 (packaging 4a). Every capability flag
  # this dist needs is already ON in cmake.base -- WITH_LIBDE265, WITH_KVAZAAR,
  # WITH_AOM_DECODER, WITH_AOM_ENCODER -- and every excluded one is already OFF
  # there, including WITH_X265 (GPL-2.0; its ABSENCE is asserted against the
  # built artefact's symbol table, not merely passed as a flag). This overlay
  # therefore adds only the cross-compile trio and the three artefact paths.
  #
  # No CMAKE_INSTALL_NAME_DIR: Mach-O concept, meaningless on ELF/Android.
  # No CMAKE_IGNORE_PREFIX_PATH: the Homebrew trap K20 guards against is
  # macOS-specific, and the NDK toolchain file already confines find_* to the
  # sysroot plus CMAKE_PREFIX_PATH={dist}.
  #
  # LIBDE265_LIBRARY points at the UNVERSIONED "libde265.so" spelling: libheif's
  # FindLIBDE265 does a find_library() against a file on disk, so libde265 must
  # be installed BEFORE libheif configures (build order is load-bearing, not
  # stylistic -- deps/heif.py enforces it). libheif then records the SONAME the
  # file carries. On android that SONAME is the plain "libde265.so" (the NDK
  # toolchain sets CMAKE_PLATFORM_NO_VERSIONED_SONAME because Android packaging
  # drops any file not ending in ".so"), and that is what ends up in DT_NEEDED.
  #
  # libheif's Findkvazaar / FindAOM probes are NON-FATAL: a configure with
  # missing inputs succeeds and the capability silently disappears. That is why
  # deps/heif.py checks these input files exist on disk before configuring AND
  # checks the codec symbols in the output afterwards.
  CMAKE_TOOLCHAIN_FILE = "{ndk}/build/cmake/android.toolchain.cmake"
  ANDROID_ABI          = "{arch.android_abi}"
  ANDROID_PLATFORM     = "{arch.android_platform}"
  LIBDE265_LIBRARY = "{dist}/lib/libde265.so"
  KVAZAAR_LIBRARY  = "{dist}/lib/libkvazaar.a"
  AOM_LIBRARY      = "{dist}/lib/libaom.a"

  [component.libheif.cmake.windows]
  _generator                   = "Ninja"
  CMAKE_C_COMPILER             = "clang-cl"
  CMAKE_CXX_COMPILER           = "clang-cl"
  CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
  CMAKE_MSVC_RUNTIME_LIBRARY   = "MultiThreaded"
  # TRANSCRIPTION SOURCE CORRECTED 2026-08-31 (R4 Task #8, lead's ruling
  # "BLOCKER A -- OPTION 1"). This overlay was originally transcribed from
  # win_build_round6.sh (the 663-line full-capability script on branch
  # ci/ci-green-round6). That is the WRONG source for this branch: the Windows
  # script actually shipped here, build_heif_dist_windows.sh @ ci/round3,
  # builds a DECODE-ONLY dist -- libde265 + libheif and nothing else.
  #
  # The defect was caught mechanically, not by reading: rendering this
  # component for windows/x86_64 emitted WITH_KVAZAAR=ON / WITH_AOM_*=ON while
  # build_heif_dist_windows.sh:164,168,169 pass all three OFF. As rendered
  # before the fix, the Windows configure was also UNSATISFIABLE: it demanded
  # {dist}/lib/aom.lib, yet [component.aom] deliberately has no
  # `source.windows` block and its comment forbids inventing one -- so no
  # Windows aom could ever be acquired to satisfy it.
  #
  # UN-PARKED 2026-08-31 by docs/logs/2026-08-31/spec-windows-codec-full-green.md
  # (in-scope item 1), which is the product-scope ruling the previous
  # comment said was required. The history is kept, not deleted: these three
  # flags were transcribed OFF from build_heif_dist_windows.sh @ci/round3 (a
  # decode-only script) under the lead's 2026-08-31 "OPTION 1" ruling, and the
  # surrounding KVAZAAR_LIBRARY / AOM_LIBRARY / -DKVZ_STATIC_LIB keys were
  # deliberately kept inert so that un-parking would be a pure flag flip. It is.
  WITH_KVAZAAR          = "ON"
  WITH_AOM_DECODER      = "ON"
  WITH_AOM_ENCODER      = "ON"
  # K11/N9, layer 3: -DKVZ_STATIC_LIB belongs on LIBHEIF's compile, not
  # kvazaar's -- kvazaar.h assumes __declspec(dllimport) unless the CONSUMER
  # defines this, and kvazaar installs no CMake package config to propagate
  # the usage requirement automatically. With WITH_KVAZAAR=OFF above it is now
  # INERT (libheif never includes kvazaar.h), and it is kept rather than
  # removed so that un-parking the round6 shape is a pure flag flip. Same for
  # the KVAZAAR_LIBRARY/AOM_LIBRARY/*_INCLUDE_DIR values below and the
  # WITH_*_PLUGIN keys inherited from cmake.base: libheif only consults them
  # inside `if(WITH_KVAZAAR)` / `if(WITH_AOM_*)`, so they render into the argv
  # but are never read. They cannot be dropped from the rendered argv in any
  # case -- §4.2 rule 1 lets a platform overlay OVERRIDE a base key, never
  # DELETE one.
  # K13/K14/N16: CMAKE_C_FLAGS/CXX_FLAGS REPLACE CMake's own MSVC defaults, so
  # -DWIN32/-D_WINDOWS/-W3/-GR/-EHsc are restored by hand. (The source script
  # passes no flags at all on libheif's configure and thus inherits exactly
  # that default set; restoring it by hand here is equivalent, plus the inert
  # define above.)
  CMAKE_C_FLAGS         = ["-DWIN32", "-D_WINDOWS", "-W3", "-DKVZ_STATIC_LIB"]
  CMAKE_CXX_FLAGS       = ["-DWIN32", "-D_WINDOWS", "-W3", "-GR", "-EHsc", "-DKVZ_STATIC_LIB"]
  LIBDE265_LIBRARY      = "{dist}/lib/de265.lib"
  KVAZAAR_LIBRARY       = "{dist}/lib/kvazaar.lib"
  AOM_LIBRARY           = "{dist}/lib/aom.lib"
  BUILD_DOCUMENTATION   = "OFF"

  [component.libheif.outputs]
  # "lib/libheif.so" (unversioned) is the ANDROID spelling and is listed LAST so
  # the desktop platforms keep reporting their versioned primary artefact: on
  # Linux both spellings exist (the unversioned one is a symlink), and the first
  # existing candidate wins. The NDK toolchain sets
  # CMAKE_PLATFORM_NO_VERSIONED_SONAME -- Android packaging ships only files
  # ending in ".so" -- so no versioned name is ever produced there. Without this
  # entry the android install succeeds and the CARRIER then reports the required
  # output missing (CI run 33457406073), which is the check doing its job
  # against an incomplete candidate list rather than a build defect.
  # libde265's candidate list already carried "lib/libde265.so" and so passed.
  shared_lib.candidates = ["lib/libheif.1.dylib", "lib/libheif.so.1", "bin/heif.dll", "lib/libheif.so"]
  shared_lib.required   = true
  import_lib.candidates = ["lib/heif.lib"]
  import_lib.required   = false

