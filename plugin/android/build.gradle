// Packaging-only Android library: it contributes nothing but jniLibs, so that
// Gradle packs libdng_decoder_native.so into the host APK.
//
// No `buildscript {}` block on purpose — the Android Gradle Plugin is supplied
// by the host application's build (Flutter's plugin loader includes this
// directory as a subproject), so pinning an AGP version here would risk
// clashing with the host's toolchain.
group = 'com.example.ceyx'
version = '1.0'

apply plugin: 'com.android.library'

android {
    namespace = 'com.example.ceyx'
    compileSdk = 36

    defaultConfig {
        minSdk = 21
    }

    // ponytail: arm64 only — that is the only ABI the native build produces
    // today (native/build-android/android-arm64). x86_64 emulators get no
    // library and RAW decode will fail there. Add more ABIs when the upstream
    // native build emits them.
    //
    // A-T8-FIX (2026-09-01): jniLibs.srcDirs packs every *.so it finds, not
    // just the decoder — arm64-v8a/ now needs libdng_decoder_native.so,
    // libheif.so, libde265.so, and libc++_shared.so together (see
    // src/main/jniLibs/README-jnilibs.md). No Gradle change was needed for
    // this: the glob below already covers a multi-.so directory by
    // construction.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
