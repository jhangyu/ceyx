name: libjxl dist (Android)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "ci/**"
    paths:
      - "native/scripts/deps/**"
      - "native/scripts/build_deps.py"
      - "native/deps/manifest.toml"
      - "native/deps/arch_map.toml"
      - ".github/workflows/jxl_dist_android.yml"

concurrency:
  group: jxl-dist-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-jxl-dist:
    name: libjxl dist (android arm64-v8a, NDK, static, encode+decode)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android NDK
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install Ninja
        shell: bash
        run: python3 native/scripts/ci.py provision ninja

      - name: Build the libjxl dist (Python carrier)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          python3 native/scripts/ci.py dist-build --component libjxl --platform android --arch arm64-v8a --android-ndk "${ANDROID_NDK_HOME}" --dist native/third_party/libjxl-dist-android-arm64-v8a --rc-marker JXL_DIST_ANDROID_RC

      - name: List the produced dist (complete)
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 native/scripts/ci.py dist-list --dist native/third_party/libjxl-dist-android-arm64-v8a

      - name: Upload the dist
        uses: actions/upload-artifact@v4
        with:
          name: libjxl-dist-android-arm64-v8a
          path: ${{ github.workspace }}/native/third_party/libjxl-dist-android-arm64-v8a
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
