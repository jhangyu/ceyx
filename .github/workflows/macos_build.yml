name: macOS Native Build

# Builds dng_decoder_native for both macOS CPU architectures. CI only verifies
# "it builds" (produces a .dylib of the expected architecture) — decode-correctness
# / PSNR gating is out of scope here because the sample DNGs are gitignored and
# not present in the repository (see docs/logs/2026-08-26/Task_cicd_bootstrap.md).
#
# Consequence for user decision D3 (skip a test cleanly when its input file is
# absent on the runner, rather than failing the job): this workflow contains no
# step that consumes a test image, sample or test directory, so there is nothing
# to guard here. The steps below are build steps and artifact checks, and they
# are all meant to fail hard. Any future step added here that reads
# image_samples/ (or any other gitignored input) must test for the input first
# and `echo "::notice::..."` + skip when it is missing.
#
# Trigger note (2026-08-26): push.paths is intentionally NOT applied to the
# push trigger below. GitHub's path-filter matching semantics for tag pushes
# aren't something we could verify without a real run, so rather than risk a
# tag push silently not triggering the release-attach step (AC5), the push
# trigger runs on every push to main/ci/** and every `v*` tag, unfiltered.
# pull_request keeps a paths filter since no tag is ever involved there.
on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/macos_build.yml"
  workflow_dispatch:

# Needed by the release-attach step (gh release create/upload) on tag pushes.
permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dng_decoder_native (${{ matrix.label }})
    # Intel leg, 2026-08-28: GitHub retired the dedicated Intel macOS runner
    # image. A job pinned to it is never scheduled — it simply sits in
    # `queued` indefinitely (observed 8h+ with zero progress), which is a hang,
    # not a failure, so nothing times out and nothing reports. Per user decision
    # D1 the Intel leg is KEPT and is now produced by CROSS-COMPILING x86_64 on
    # an Apple-silicon runner. Both legs therefore run on macos-14.
    #
    # The cross-compile reuses the two-stage machinery this project already has
    # for Android (DNG_HOST_GENERATORS_ONLY -> DNG_CROSS_BUILD), rather than
    # setting CMAKE_OSX_ARCHITECTURES=x86_64 over the whole tree in one pass:
    # the Halide generators are build-time tools that must EXECUTE on the runner,
    # so they have to stay arm64 (host) while the AOT code they emit targets
    # x86-64. Stage 1 builds arm64 generators and runs them with
    # DNG_AOT_TARGET_OVERRIDE=x86-64-osx-metal-...; stage 2 compiles the actual
    # library for x86_64 against those prebuilt AOT artifacts. A single-pass
    # x86_64 configure would produce x86_64 generator binaries and then depend on
    # Rosetta being present to run them.
    #
    # Two dependency-architecture blockers had to be resolved for stage 2:
    #   * libjpeg-turbo — native/cmake/third_party.cmake probes
    #     `brew --prefix jpeg-turbo`, and Homebrew installs the HOST arch only.
    #     That file now verifies the probed libjpeg.a with `lipo -archs` and
    #     falls back to building the vendored libjpeg-turbo from source for the
    #     target arch when the archive does not contain it.
    #   * libheif/libde265 — native/scripts/fetch_heif_deps.sh used to hard-pin
    #     -DCMAKE_OSX_ARCHITECTURES=arm64. It now honours DNG_HEIF_ARCH and
    #     records the arch in its version stamp, so an arm64 dist is not
    #     mistaken for an x86_64 one.
    # The remaining vendored dependencies of the x86_64 link were checked and
    # need no arch handling: LibRaw, RawSpeed3 and the Adobe DNG SDK are built
    # from source in-tree and follow CMAKE_OSX_ARCHITECTURES; zlib comes from
    # the macOS SDK, which is universal; the Halide runtime is an AOT artifact
    # emitted by stage 1 for the x86-64 target; and libomp is not involved at
    # all because DNG_CROSS_BUILD turns the desktop OpenMP path off
    # (native/cmake/tests.cmake).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: apple-silicon
            runner: macos-14
            arch_tag: arm64
            cross: "false"
            # D5: the overlay triplet whose VCPKG_OSX_ARCHITECTURES matches this
            # leg's output. Getting this wrong yields a wrong-architecture
            # libwebp.a and an architecture-mismatch link failure, not a silent
            # miscompile.
            vcpkg_triplet: arm64-osx-heif
            # Directory holding the produced dylib, and the directory to cache.
            dylib_dir: native/build
            build_cache_path: native/build
            # fetch_heif_deps.sh writes the HOST-arch dist here and a
            # cross-arch dist to heif-dist-<arch>; heif.cmake searches both.
            heif_dist_dir: native/third_party/heif-dist
          - label: intel
            runner: macos-14
            arch_tag: x86_64
            cross: "true"
            vcpkg_triplet: x64-osx-heif
            dylib_dir: native/build-macos-x86_64/target
            build_cache_path: native/build-macos-x86_64
            heif_dist_dir: native/third_party/heif-dist-x86_64
    env:
      REPO_ROOT: ${{ github.workspace }}
      NATIVE_DIR: ${{ github.workspace }}/native
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      DYLIB: ${{ github.workspace }}/${{ matrix.dylib_dir }}/libdng_decoder_native.dylib
      # Halide AOT target for the cross leg. Kept here (not inline) so the
      # string appears exactly once.
      X86_AOT_TARGET: x86-64-osx-metal-no_asserts-no_bounds_query
      HOST_GEN_DIR: ${{ github.workspace }}/native/build-macos-x86_64/host-generators
      # D5: pinned vcpkg baseline. Same SHA as native/vcpkg/vcpkg.json's
      # builtin-baseline, vcpkg-configuration.json's default-registry baseline
      # and port_spike.yml's VCPKG_BASELINE (N30 — four places, one value).
      VCPKG_BASELINE: abb6dda5cc32914d2e64d7d72b974dc301d1fc8a
      VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
      # The vcpkg PATHS deliberately do NOT live here. The `runner` context is
      # not available in a job-level `env:` block — using it there is a workflow
      # STARTUP failure (the run reports its name as the file path and executes
      # zero jobs), which is how the first D5 push failed. `matrix` IS available
      # here, which is why VCPKG_TRIPLET above is fine; RUNNER_TEMP is available
      # as an ordinary environment variable inside `run:` steps, so the paths
      # are composed there.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # nasm/yasm are required by fetch_heif_deps.sh's aom build: aom's x86_64
      # codepath is hand-written assembly (unlike the arm64 codepath, which is
      # NEON intrinsics compiled by the C compiler), and its cmake configure
      # hard-fails ("Unable to find assembler") without an assembler on PATH.
      # Confirmed via the macos-14 runner-images manifest (actions/runner-images
      # images/macos/macos-14-Readme.md, Utilities section) that neither nasm nor
      # yasm is preinstalled.
      #
      # yasm is installed (not just nasm): aom's build/cmake/aom_configure.cmake
      # `find_program(CMAKE_ASM_NASM_COMPILER yasm ...)` looks for yasm FIRST and
      # only falls back to nasm when yasm is absent or ENABLE_NASM is set (which
      # this project does not set). When a real nasm IS selected, aom additionally
      # runs test_nasm() (build/cmake/aom_optimization.cmake), which greps `nasm
      # -hf` output for the literal substring "-Ox" to confirm multipass
      # optimization support; Homebrew's current nasm (3.02) no longer prints
      # "-Ox" under `-hf` (verified locally: `nasm -hf` lists only `-f` object
      # formats, dropping the "-Ox" line older nasm releases used to include),
      # so aom's version-probe now hard-fails configure even though nasm 3.02 is
      # fully capable. yasm has no such probe and is unaffected. nasm is kept
      # installed alongside yasm as a harmless secondary assembler (aom will not
      # select it while yasm is present) and because other vendored deps in this
      # tree may still expect it on PATH; removing it is not necessary to fix
      # this failure.
      - name: Install build prerequisites (Homebrew)
        run: |
          brew update
          brew install cmake ninja jpeg-turbo nasm yasm

      - name: Cache vendored Halide v21 distribution
        id: cache-halide
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/native/third_party/halide
          key: halide-v21-${{ runner.os }}-${{ matrix.arch_tag }}-${{ hashFiles('native/scripts/fetch_halide_v21_dist.sh') }}

      - name: Fetch vendored Halide v21 distribution
        run: native/scripts/fetch_halide_v21_dist.sh

      # Configure fails without this (cmake/tests.cmake requires LibRaw
      # unless DNG_ENABLE_GENERIC_RAW=OFF, which we will not disable just to
      # skip a fetch step — see fetch_libraw_dist.sh for what it vendors).
      # Cached like the Halide distribution: the script is idempotent (each
      # component checks a .vendor-rev sidecar and skips its clone when the
      # pinned revision already matches), so restoring third_party/libraw and
      # third_party/libraw-cmake from cache lets the script no-op instead of
      # doing three separate network clones + patch-apply passes per run.
      # ~7.5MB is small, but network clones are the part worth avoiding
      # (latency/flakiness), not the bytes. Key includes the patch files
      # because a patch-set change requires re-applying, not just re-cloning.
      - name: Cache vendored LibRaw distribution
        id: cache-libraw
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/native/third_party/libraw
            ${{ github.workspace }}/native/third_party/libraw-cmake
          key: libraw-${{ runner.os }}-${{ matrix.arch_tag }}-${{ hashFiles('native/scripts/fetch_libraw_dist.sh', 'native/patches/rawspeed3/*.patch', 'native/patches/libraw/*.patch') }}

      - name: Fetch vendored LibRaw distribution
        run: native/scripts/fetch_libraw_dist.sh

      # D5 (2026-08-31): libwebp is supplied by vcpkg, pinned to exactly 1.6.0 in
      # native/vcpkg/vcpkg.json. cmake/encode.cmake resolves it with
      # find_package(WebP CONFIG) and HARD-FAILS the configure when it is
      # absent, so this step is load-bearing, not best-effort.
      #
      # D5 leg 2 (2026-08-31): libde265 now comes from here too, via the
      # manifest's `de265` feature, and fetch_heif_deps.sh COPIES it out of this
      # prefix instead of building it. That is why this block runs BEFORE the
      # HEIF dist step below rather than after it.
      #
      # --x-no-default-features --x-feature=de265 installs the core dependency
      # set (libwebp) plus libde265, and nothing else. The full `heif` feature is
      # NOT wanted here: this leg still builds libheif itself from source with
      # the kvazaar HEVC encoder, which no registry libheif offers (Spec §3.2),
      # so installing it from vcpkg would build a second unused copy and pay for
      # aom+kvazaar twice.
      #
      # Bootstrap mirrors port_spike.yml's (clone, checkout the pinned baseline,
      # bootstrap-vcpkg.sh) rather than using a marketplace action, so both
      # workflows acquire vcpkg the same way.
      - name: Bootstrap vcpkg at the pinned baseline (D5)
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" version

      - name: vcpkg install libwebp + libde265 + aom (${{ matrix.vcpkg_triplet }})
        run: |
          set +e
          "$RUNNER_TEMP/vcpkg/vcpkg" install \
              --x-manifest-root="$GITHUB_WORKSPACE/native/vcpkg" \
              --x-install-root="$RUNNER_TEMP/vcpkg-installed" \
              --triplet="$VCPKG_TRIPLET" \
              --x-no-default-features \
              --x-feature=de265 \
              --x-feature=aom \
              --no-print-usage
          rc=$?
          echo "VCPKG_INSTALL_RC=${rc}"
          exit $rc

      # Prove the artefacts before the product build consumes them. libwebp: a
      # STATIC archive of the RIGHT architecture — the linkage half is the
      # assertion that was missing when the triplets silently produced a dylib
      # here; the architecture half is what the cross leg gets wrong if
      # vcpkg_triplet and CMAKE_OSX_ARCHITECTURES disagree. libde265: a SHARED
      # library (A5.2 — LGPL-3 §4(d)(1); the default triplets are static, so this
      # assertion is the only thing between a triplet typo and a compliance
      # breach) of the same architecture.
      - name: Assert the vcpkg artefacts (libwebp static, libde265 shared)
        run: |
          set -e
          VCPKG_PREFIX="$RUNNER_TEMP/vcpkg-installed/$VCPKG_TRIPLET"
          ls -la "$VCPKG_PREFIX/lib"
          test -f "$VCPKG_PREFIX/lib/libwebp.a" \
            || { echo "FAIL: libwebp.a absent (expected a static archive)"; exit 1; }
          shared=$(find "$VCPKG_PREFIX/lib" -name 'libwebp*.dylib' | wc -l | tr -d ' ')
          test "$shared" = "0" \
            || { echo "FAIL: ${shared} libwebp dylib(s) present; the triplet must keep libwebp static (LGPL asymmetry applies to libheif/libde265 only)"; exit 1; }
          archs=$(lipo -archs "$VCPKG_PREFIX/lib/libwebp.a")
          echo "libwebp.a archs: ${archs}"
          echo "${archs}" | grep -qw "${{ matrix.arch_tag }}" \
            || { echo "FAIL: libwebp.a archs '${archs}' do not include ${{ matrix.arch_tag }}"; exit 1; }
          de265=$(find "$VCPKG_PREFIX/lib" -name 'libde265*.dylib' | wc -l | tr -d ' ')
          test "$de265" != "0" \
            || { echo "FAIL: no libde265 dylib in the vcpkg prefix; a static libde265 is an LGPL-3 4(d)(1) breach, not a packaging detail [A5.2]"; exit 1; }
          test ! -f "$VCPKG_PREFIX/lib/libde265.a" \
            || { echo "FAIL: libde265.a present; the triplet's dynamic exception did not apply [A5.2]"; exit 1; }
          # Whichever spelling the port produced as the REAL file (the other is a
          # symlink to it); -L makes lipo follow it either way.
          de265_lib=$(find "$VCPKG_PREFIX/lib" -name 'libde265*.dylib' | head -n 1)
          de265_archs=$(lipo -archs "$de265_lib")
          echo "libde265 archs: ${de265_archs}"
          echo "${de265_archs}" | grep -qw "${{ matrix.arch_tag }}" \
            || { echo "FAIL: libde265 archs '${de265_archs}' do not include ${{ matrix.arch_tag }}"; exit 1; }
          # aom (D5 leg 3): STATIC — it is linked INTO libheif, so a dylib here
          # would have to be shipped and resolved at runtime instead. Arch is
          # checked for the same reason as libwebp's: the cross leg is the one
          # that gets it wrong, and the old source build forced AOM_TARGET_CPU
          # by hand precisely because aom otherwise follows the HOST cpu.
          test -f "$VCPKG_PREFIX/lib/libaom.a" \
            || { echo "FAIL: libaom.a absent (expected a static archive)"; exit 1; }
          aom_shared=$(find "$VCPKG_PREFIX/lib" -name 'libaom*.dylib' | wc -l | tr -d ' ')
          test "$aom_shared" = "0" \
            || { echo "FAIL: ${aom_shared} libaom dylib(s) present; aom must stay static (it is linked into libheif)"; exit 1; }
          aom_archs=$(lipo -archs "$VCPKG_PREFIX/lib/libaom.a")
          echo "libaom.a archs: ${aom_archs}"
          echo "${aom_archs}" | grep -qw "${{ matrix.arch_tag }}" \
            || { echo "FAIL: libaom.a archs '${aom_archs}' do not include ${{ matrix.arch_tag }}"; exit 1; }

      # macOS is the one platform that genuinely ships the HEIC decode route, so
      # unlike the Linux/Android workflows (which configure with
      # -DDNG_ENABLE_HEIF=OFF) it FETCHES the dist rather than disabling it.
      # Without this, configure hard-fails at native/cmake/heif.cmake:31 with
      # "HEIF decode is enabled but the vendored dist is missing".
      #
      # Cached in the same shape as Halide/LibRaw above, and for a much stronger
      # reason: the carrier does not download a prebuilt dist, it BUILDS libheif
      # (and kvazaar) from source, which is minutes of runner time per job.
      #
      # R4 (2026-08-31): the dist is now produced by the Python carrier
      # (native/scripts/build_deps.py, the port of fetch_heif_deps.sh), so the
      # cache key hashes the carrier and the MANIFEST it reads its versions,
      # hashes and cmake options from — not the retired shell script. Missing
      # native/deps/manifest.toml from this key would be the exact defect the
      # libde265 clause below already guards against: a version bump that
      # restores a stale dist from cache and reports success. The vcpkg manifest
      # + libde265 overlay port stay in the key because since D5 leg 2 the
      # dist's libde265 comes from that port. arch_tag is part of the key
      # because the two legs need different-architecture dylibs.
      - name: Cache vendored HEIF (libheif + libde265) distribution
        id: cache-heif
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/${{ matrix.heif_dist_dir }}
          key: heif-${{ runner.os }}-${{ matrix.arch_tag }}-${{ hashFiles('native/scripts/build_deps.py', 'native/scripts/deps/*.py', 'native/deps/manifest.toml', 'native/deps/arch_map.toml', 'native/vcpkg/vcpkg.json', 'native/vcpkg/ports/libde265/**') }}

      # CEYX_VCPKG_PREFIX is mandatory here since D5 leg 2: the libde265 stage
      # copies the dylib out of it and hard-fails when it is unset, rather than
      # falling back to a source build (a silent fallback would hide exactly the
      # wiring this change exists to prove).
      #
      # --arch is passed EXPLICITLY rather than through the old DNG_HEIF_ARCH
      # environment variable, and --dist names the same directory the cache
      # step above and the assertions below use. The cross leg's dist path is a
      # matrix value, so the carrier is never left to infer "host arch or not"
      # from a runner it is cross-compiling on.
      - name: Fetch vendored HEIF distribution (Python carrier)
        run: |
          export CEYX_VCPKG_PREFIX="$RUNNER_TEMP/vcpkg-installed/$VCPKG_TRIPLET"
          python3 native/scripts/build_deps.py build heif-stack \
              --platform macos \
              --arch "${{ matrix.arch_tag }}" \
              --dist "$GITHUB_WORKSPACE/${{ matrix.heif_dist_dir }}"

      # THE load-bearing evidence for D5 leg 2. A green build proves nothing
      # here: libheif links fine against a dylib whose recorded dependency is an
      # absolute path into $RUNNER_TEMP, and the failure only appears on a
      # machine that has no such directory — i.e. never on CI. So assert the
      # LOAD COMMANDS of the shipped artefacts, positively (@rpath present) and
      # negatively (no build-machine absolute path).
      #
      # Skipped when the dist came from cache: the cache key covers the fetch
      # script, the manifest and the overlay port, so a hit means these exact
      # bytes were asserted on the run that produced them — but a hit ALSO means
      # the copy path did not execute, so saying so out loud beats a PASS that
      # silently means "not checked" (lesson 2026-08-25).
      - name: Assert libde265's linkage in the produced dist (A5.2/A5.3)
        run: |
          set -e
          DIST="$GITHUB_WORKSPACE/${{ matrix.heif_dist_dir }}"
          echo "cache-hit=${{ steps.cache-heif.outputs.cache-hit }}"
          ls -la "$DIST/lib"
          test -f "$DIST/lib/libde265.0.dylib" \
            || { echo "FAIL: $DIST/lib/libde265.0.dylib absent — heif.cmake stages exactly this name next to dng_decoder_native"; exit 1; }
          test -e "$DIST/lib/libde265.dylib" \
            || { echo "FAIL: $DIST/lib/libde265.dylib absent — fetch_heif_deps.sh points libheif at the UNVERSIONED name"; exit 1; }
          id_out=$(otool -D "$DIST/lib/libde265.0.dylib")
          echo "$id_out"
          grep -q '^@rpath/libde265.0.dylib$' <<< "$id_out" \
            || { echo "FAIL: libde265's install name is not @rpath/libde265.0.dylib; libheif would record whatever this says and resolve it on the BUILD machine only"; exit 1; }
          heif_deps=$(otool -L "$DIST/lib/libheif.1.dylib" | tail -n +2)
          echo "$heif_deps"
          grep -q '@rpath/libde265' <<< "$heif_deps" \
            || { echo "FAIL: libheif does not reference libde265 via @rpath"; exit 1; }
          if grep -q "$RUNNER_TEMP" <<< "$heif_deps"; then
            echo "FAIL: libheif carries a load command into the build machine's vcpkg prefix ($RUNNER_TEMP) — this ships a dylib that loads nowhere else"
            exit 1
          fi

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/${{ matrix.build_cache_path }}
          key: native-build-${{ runner.os }}-${{ matrix.arch_tag }}-${{ hashFiles('native/CMakeLists.txt') }}
          restore-keys: |
            native-build-${{ runner.os }}-${{ matrix.arch_tag }}-

      - name: Build dng_decoder_native via watchdog (native arm64)
        if: matrix.cross == 'false'
        working-directory: ${{ github.workspace }}
        run: |
          # CEYX_VCPKG_PREFIX, not --cmake-arg: the watchdog's own resolver runs
          # before every non-Android configure, is mandatory, and aborts when it
          # locates no prefix — even if one was passed as an explicit cmake arg
          # (run 33325970570). The env var is the supported channel and gets the
          # watchdog's prefix validation for free.
          export CEYX_VCPKG_PREFIX="$RUNNER_TEMP/vcpkg-installed/$VCPKG_TRIPLET"
          python3 native/scripts/build_native_watchdog.py \
            --target dng_decoder_native \
            --idle-timeout-sec 180

      # Cross leg, stage 1: arm64 host generators, emitting x86-64 AOT code.
      - name: Build host Halide generators + x86-64 AOT (cross stage 1)
        if: matrix.cross == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          # Needed even though this stage sets DNG_HOST_GENERATORS_ONLY (which
          # makes cmake/encode.cmake a no-op): the watchdog's vcpkg resolver
          # runs before EVERY non-Android configure regardless of what the
          # configure will go on to do, so a stage that does not use libwebp
          # still cannot start without a locatable prefix.
          export CEYX_VCPKG_PREFIX="$RUNNER_TEMP/vcpkg-installed/$VCPKG_TRIPLET"
          python3 native/scripts/build_native_watchdog.py \
            --build-dir "${HOST_GEN_DIR}" \
            --target dng_all_aot \
            --idle-timeout-sec 600 \
            --cmake-arg=-DDNG_HOST_GENERATORS_ONLY=ON \
            "--cmake-arg=-DDNG_AOT_TARGET_OVERRIDE=${X86_AOT_TARGET}"
          echo "--- AOT artifacts:"
          ls -la "${HOST_GEN_DIR}/halide_generated"
          echo "--- architecture of an emitted AOT archive (expect x86_64):"
          lipo -archs "${HOST_GEN_DIR}/halide_generated/dng_render_stage4.a"

      # Cross leg, stage 2: compile the shipped library for x86_64 against the
      # stage-1 AOT artifacts.
      - name: Cross-compile dng_decoder_native for x86_64 (cross stage 2)
        if: matrix.cross == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          export CEYX_VCPKG_PREFIX="$RUNNER_TEMP/vcpkg-installed/$VCPKG_TRIPLET"
          python3 native/scripts/build_native_watchdog.py \
            --build-dir "${{ github.workspace }}/${{ matrix.dylib_dir }}" \
            --target dng_decoder_native \
            --idle-timeout-sec 600 \
            --cmake-arg=-DDNG_CROSS_BUILD=ON \
            "--cmake-arg=-DDNG_PREBUILT_AOT_DIR=${HOST_GEN_DIR}/halide_generated" \
            --cmake-arg=-DCMAKE_OSX_ARCHITECTURES=x86_64

      # AC: the run log must show the intel dylib reporting x86_64. `lipo -archs`
      # output is both printed and asserted — printing alone would let a wrong
      # architecture pass unnoticed, and asserting alone would leave no evidence
      # in the log.
      - name: Verify dylib was produced and has the expected architecture
        run: |
          if [ ! -f "$DYLIB" ]; then
            echo "::error::Expected dylib not found at $DYLIB"
            exit 1
          fi
          file "$DYLIB"
          ARCHS="$(lipo -archs "$DYLIB")"
          echo "lipo -archs => ${ARCHS}"
          if [ "${ARCHS}" != "${{ matrix.arch_tag }}" ]; then
            echo "::error::Expected architecture '${{ matrix.arch_tag }}' but the dylib reports '${ARCHS}'"
            exit 1
          fi
          otool -L "$DYLIB"

      - name: Stage native artifact
        run: |
          mkdir -p "${ARTIFACT_DIR}/native"
          cp "$DYLIB" "${ARTIFACT_DIR}/native/"
          ls -la "${ARTIFACT_DIR}/native"

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: dng_decoder_native-macos-${{ matrix.label }}
          path: ${{ github.workspace }}/artifacts/native
          if-no-files-found: error
          retention-days: 14

      # AC5: attach the built dylib to the GitHub Release for this tag.
      # Uses the `gh` CLI, which is preinstalled on GitHub-hosted runners
      # — chosen over a third-party action (e.g. softprops/action-gh-release)
      # to avoid an extra dependency for what `gh release create`/`gh release
      # upload` already do directly with the runner-provided GITHUB_TOKEN.
      - name: Attach artifact to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ASSET="${ARTIFACT_DIR}/native/libdng_decoder_native-macos-${{ matrix.label }}.dylib"
          cp "${ARTIFACT_DIR}/native/libdng_decoder_native.dylib" "$ASSET"
          # Both matrix legs (apple-silicon, intel) run this step concurrently
          # for the same tag, so "view, then create if missing" is a TOCTOU
          # race: both can observe "not found" and both call `gh release
          # create`, and the loser fails with "release already exists". The
          # `|| true` tolerates that specific loser outcome — either way the
          # release now exists (created by whichever leg won), which is all
          # the following upload needs. If create fails for an unrelated
          # reason, the upload step below fails loudly and surfaces it.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" "$ASSET" --clobber
