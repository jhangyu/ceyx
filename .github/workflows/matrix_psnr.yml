name: Matrix PSNR Regression (manual only)

# Manual-dispatch only (2026-08-26): this gate needs
# image_samples/lossless_dng_sample.dng and lossy_dng_sample.dng, which are
# gitignored and not present in the repository. The user has ruled that
# automatic CI only verifies "it builds"; decode-correctness / PSNR
# regression stays manual-trigger until sample assets are provisioned in the
# runner environment. See docs/logs/2026-08-26/Task_cicd_bootstrap.md AC7.
on:
  workflow_dispatch:

concurrency:
  group: matrix-psnr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-psnr:
    name: Run 4-case decode matrix + PSNR gate
    runs-on: macos-14
    timeout-minutes: 45
    needs: []
    env:
      REPO_ROOT: ${{ github.workspace }}
      NATIVE_DIR: ${{ github.workspace }}/native
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check sample DNGs
        id: samples
        run: |
          missing=0
          for sample in \
            "${REPO_ROOT}/image_samples/lossless_dng_sample.dng" \
            "${REPO_ROOT}/image_samples/lossy_dng_sample.dng"; do
            if [ ! -f "$sample" ]; then
              echo "::warning::Missing ${sample}; PSNR matrix will be skipped."
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build prerequisites
        if: steps.samples.outputs.available == 'true'
        run: |
          brew update
          brew install cmake ninja jpeg-turbo

      - name: Build test_decode target
        if: steps.samples.outputs.available == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          python3 native/scripts/build_native_watchdog.py --target test_decode

      - name: Build test_device_handoff target
        if: steps.samples.outputs.available == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          python3 native/scripts/build_native_watchdog.py \
            --target test_device_handoff --skip-configure

      - name: Run run_decode_matrix.py (PSNR gate enforced by W5)
        if: steps.samples.outputs.available == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          python3 native/tests/run_decode_matrix.py \
            --repeat 1 \
            --device-handoff-harness native/build/test_device_handoff

      - name: Upload PSNR matrix artifacts
        if: always() && steps.samples.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: matrix-psnr-artifacts
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: warn
          retention-days: 7
