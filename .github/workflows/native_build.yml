name: Native Build (placeholder)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "dng_processor/native/**"
      - ".github/workflows/native_build.yml"

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    name: Build dng_decoder_native (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      REPO_ROOT: ${{ github.workspace }}
      NATIVE_DIR: ${{ github.workspace }}/dng_processor/native
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build prerequisites (Homebrew)
        run: |
          brew update
          brew install cmake ninja jpeg
          echo "CMAKE_PREFIX_PATH=$(brew --prefix jpeg):${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/dng_processor/native/build
          key: native-build-${{ runner.os }}-${{ hashFiles('dng_processor/native/CMakeLists.txt') }}
          restore-keys: |
            native-build-${{ runner.os }}-

      - name: Record native build start
        run: echo "NATIVE_BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build dng_decoder_native via watchdog
        id: native_build
        working-directory: ${{ github.workspace }}
        run: |
          python3 dng_processor/native/scripts/build_native_watchdog.py --target dng_decoder_native

      - name: Collect AOT build metrics (observation-only)
        if: ${{ always() }}
        continue-on-error: true
        env:
          NATIVE_BUILD_OUTCOME: ${{ steps.native_build.outcome }}
        run: |
          python3 <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          native_dir = Path(os.environ["NATIVE_DIR"])
          artifact_dir.mkdir(parents=True, exist_ok=True)
          build_succeeded = os.environ["NATIVE_BUILD_OUTCOME"] == "success"
          aot_files = (
              sorted((native_dir / "build" / "halide_generated").glob("*.a"))
              if build_succeeded else []
          )
          aot_artifacts = {path.name: path.stat().st_size for path in aot_files}
          dylib = native_dir / "build" / "libdng_decoder_native.dylib"
          started_at_raw = os.environ.get("NATIVE_BUILD_STARTED_AT")
          try:
              started_at = int(started_at_raw) if started_at_raw else None
          except ValueError:
              started_at = None
          metrics = {
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "commit": os.environ["GITHUB_SHA"],
              "build_outcome": os.environ["NATIVE_BUILD_OUTCOME"],
              "build_duration_seconds": (
                  max(0, int(time.time()) - started_at)
                  if started_at is not None else None
              ),
              "build_duration_status": (
                  "recorded" if started_at is not None
                  else "start_timestamp_missing_or_invalid"
              ),
              "artifact_size_status": (
                  "collected" if build_succeeded
                  else "not_collected_build_outcome_not_success"
              ),
              "dylib_size_bytes": (
                  dylib.stat().st_size if build_succeeded and dylib.is_file()
                  else None
              ),
              "aot_total_bytes": sum(aot_artifacts.values()) if aot_files else None,
              "aot_artifacts": aot_artifacts,
          }
          (artifact_dir / "aot_build_metrics.json").write_text(
              json.dumps(metrics, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("### AOT Build Metrics (observation-only)\n\n")
              summary.write("| Metric | Value |\n|---|---|\n")
              for key in ("build_outcome", "build_duration_seconds",
                          "build_duration_status", "artifact_size_status",
                          "dylib_size_bytes", "aot_total_bytes"):
                  summary.write(f"| {key} | {metrics[key]} |\n")
          PY

      - name: Stage native artifacts
        run: |
          mkdir -p "${ARTIFACT_DIR}/native"
          if [ -d "${NATIVE_DIR}/build" ]; then
            find "${NATIVE_DIR}/build" -maxdepth 3 -name "libdng_decoder_native*" -exec cp {} "${ARTIFACT_DIR}/native/" \; || true
          fi
          ls -la "${ARTIFACT_DIR}/native" || true

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: dng_decoder_native-macos-arm64
          path: ${{ github.workspace }}/artifacts/native
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AOT build metrics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aot-build-metrics-macos-arm64
          path: ${{ github.workspace }}/artifacts/aot_build_metrics.json
          if-no-files-found: warn
          retention-days: 7
