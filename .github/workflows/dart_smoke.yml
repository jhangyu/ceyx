name: Dart / Flutter Smoke

# Runs on push to ci/** branches and on manual dispatch (2026-08-28).
# Compile/analyze + unit tests only (supersedes the earlier FFI-smoke design):
# `dart analyze` always runs and fails hard on analyzer errors, and the tracked
# Flutter unit tests run. No step decodes an image — the FFI smoke that read a
# gitignored sample DNG (never present on CI) was removed; that decode check
# stays a LOCAL-ONLY developer step. See
# docs/logs/2026-08-28/Task_ci_repair_contract.md.
on:
  push:
    branches:
      - "ci/**"
  workflow_dispatch:

concurrency:
  group: dart-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-smoke:
    name: dart analyze + flutter test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: ${{ github.workspace }}/app
        run: flutter pub get

      - name: dart analyze
        working-directory: ${{ github.workspace }}/app
        run: dart analyze

      - name: flutter test (if present)
        working-directory: ${{ github.workspace }}/app
        run: |
          test_count=0
          if [ -d test ]; then
            test_count=$(find test -name "*_test.dart" -type f | wc -l | tr -d ' ')
          fi
          if [ "$test_count" -gt 0 ]; then
            flutter test
          else
            echo "::notice::No Flutter test files (test/**/*_test.dart) present; skipping 'flutter test'."
          fi
