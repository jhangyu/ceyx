name: Dart / Flutter Smoke (manual only)

# Manual-dispatch only (2026-08-26): the FFI smoke step needs
# image_samples/lossless_dng_sample.dng, which is gitignored and not present
# in the repository, so this cannot run unattended on every PR without
# always short-circuiting. Trigger by hand from the Actions tab once sample
# assets are available in the runner environment. See
# docs/logs/2026-08-26/Task_cicd_bootstrap.md AC7.
on:
  workflow_dispatch:

concurrency:
  group: dart-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-smoke:
    name: dart analyze + flutter test
    runs-on: macos-14
    timeout-minutes: 30
    env:
      REPO_ROOT: ${{ github.workspace }}
      FLUTTER_DIR: ${{ github.workspace }}/app
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: ${{ github.workspace }}/app
        run: flutter pub get

      - name: dart analyze
        working-directory: ${{ github.workspace }}/app
        run: dart analyze

      - name: flutter test (if present)
        working-directory: ${{ github.workspace }}/app
        run: |
          if [ -d test ] && find test -name "*_test.dart" -print -quit | grep -q .; then
            flutter test
          else
            echo "::notice::No Flutter tests found; skipping flutter test."
          fi

      - name: Download native artifact (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dng_decoder_native-macos-arm64
          path: ${{ github.workspace }}/artifacts/native

      - name: Optional FFI smoke (requires sample DNG + native dylib)
        working-directory: ${{ github.workspace }}/app
        env:
          DNG_NATIVE_BUILD_DIR: ${{ github.workspace }}/artifacts/native
        run: |
          SAMPLE="${REPO_ROOT}/image_samples/lossless_dng_sample.dng"
          DYLIB="${DNG_NATIVE_BUILD_DIR}/libdng_decoder_native.dylib"
          if [ ! -f "$SAMPLE" ]; then
            echo "::warning::Sample DNG not available; skipping FFI smoke."
            exit 0
          fi
          if [ ! -f "$DYLIB" ]; then
            echo "::warning::Native dylib not available at ${DYLIB}; skipping FFI smoke."
            exit 0
          fi
          dart run bin/benchmark_zero_copy.dart "$SAMPLE"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-smoke-artifacts
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: ignore
          retention-days: 7
