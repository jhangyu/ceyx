name: Android Build (Vulkan cross-compile)

# REUSABLE WORKFLOW (round 6, Plan B). No triggers of its own: invoked
# exclusively by .github/workflows/build.yml, which owns the push/PR/tag/
# dispatch trigger set for every platform leg. See linux_build.yml's header
# for why re-adding a standalone trigger here is a defect.
on:
  workflow_call:

# Concurrency is inherited from the calling workflow; see linux_build.yml.

jobs:
  build-android:
    # Runner choice (2026-08-26, CI/CD bootstrap task #2):
    #   ubuntu-latest, not a macOS runner.
    #   - Cost: GitHub-hosted Ubuntu minutes bill at the 1x multiplier vs
    #     macOS's 10x. Nothing in this build needs Xcode/Metal: Stage 1 (host
    #     Halide generators) only needs a C++ host toolchain plus the vendored
    #     Halide distribution, and Stage 2 (NDK cross-compile) runs the same
    #     way on any host OS.
    #   - Stage 1 needs the HOST Halide v21 distribution matching the
    #     runner's OS/arch. native/scripts/fetch_halide_v21_dist.sh's OS_NAME
    #     case explicitly supports Linux hosts (both the arm64 and the x86_64
    #     Halide host distributions),
    #     so an Ubuntu host is not blocked on the Halide side.
    #   - The Stage 2 NDK toolchain is pinned via nttld/setup-ndk below
    #     (rather than relying on whichever NDK revision happens to be
    #     preinstalled on the runner image) so the arm64-v8a / android-24
    #     target this build produces does not silently drift when GitHub
    #     bumps the default runner image's bundled NDK.
    # Display name only; renders as "Android / arm64-v8a Vulkan". See
    # linux_build.yml for why the platform word is not repeated here.
    name: arm64-v8a Vulkan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `contents: write` was dropped in round 6 together with the release-attach
    # step it existed for. This leg now only reads the repo and uploads
    # artifacts; the publish job in build.yml holds the write scope.
    permissions:
      contents: read
    env:
      REPO_ROOT: ${{ github.workspace }}
      NATIVE_DIR: ${{ github.workspace }}/native
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build prerequisites (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential libjpeg-dev zlib1g-dev

      - name: Set up Android NDK
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Cache vendored Halide v21 distribution (host, Linux)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/native/third_party/halide
          key: halide-v21-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/scripts/deps/fetch_halide.py') }}

      - name: Fetch vendored Halide v21 distribution (host)
        working-directory: ${{ github.workspace }}
        run: python3 native/scripts/build_deps.py fetch halide

      # native/third_party/libraw is gitignored; DNG_ENABLE_GENERIC_RAW
      # defaults ON (native/CMakeLists.txt) and cmake/tests.cmake hard-fails
      # configure without it, on EVERY build (host generators or Android
      # cross-compile), so this has to run before Stage 1. Not disabling the
      # feature to route around the missing vendor tree: that would drop the
      # generic RAW frontend from the shipped binary, not just fix CI.
      - name: Cache vendored LibRaw + RawSpeed3 + LibRaw-cmake (pinned revisions)
        # Cached like Halide: fetch_libraw_dist.sh does three git clones from
        # public GitHub plus patch application, all deterministic given the
        # pinned revisions in the script and the project-authored patch sets
        # applied on top, so a cache hit reproduces byte-identical output.
        # Keyed on the script AND both patch directories (not just the
        # script) because the pinned revisions live in the script but the
        # patches applied on top of them are separate tracked files that can
        # change independently and must invalidate the cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/native/third_party/libraw
            ${{ github.workspace }}/native/third_party/libraw-cmake
          key: libraw-${{ hashFiles('native/scripts/deps/fetch_libraw.py', 'native/patches/libraw/**', 'native/patches/rawspeed3/**') }}

      - name: Fetch vendored LibRaw + RawSpeed3 + LibRaw-cmake
        working-directory: ${{ github.workspace }}
        run: python3 native/scripts/build_deps.py fetch libraw

      - name: Build dng_decoder_native for Android
        # Two-stage cross-compile driven entirely by the sanctioned entry
        # point (native/scripts/build_native_watchdog.py --platform android):
        #   Stage 1 (host): builds the Halide generators natively and runs
        #     AOT codegen for the strict Android Vulkan target
        #     (arm-64-android-vulkan-vk_int8-vk_int16-vk_int64-...), matching
        #     native/CMakePresets.json's "android-vulkan-stage1" preset.
        #   Stage 2 (NDK cross-compile): configures with the NDK toolchain
        #     file and DNG_PREBUILT_AOT_DIR pointing at Stage 1's output,
        #     matching the "android-vulkan" preset, then builds
        #     dng_decoder_native (-> libdng_decoder_native.so).
        # --idle-timeout-sec is raised above the script's 60s default as a
        # margin for CI hosts, which can be slower/noisier than local dev
        # machines during long Halide codegen steps.
        # -DDNG_ENABLE_HEIF=ON (A-T8-FIX, 2026-09-01): FLIPPED from the prior
        # OFF. native/third_party/heif-dist-android-arm64-v8a is now a real,
        # committed dist (libheif.so/libde265.so + headers + licences, landed
        # by jxl_dist_android.yml's sibling heif_dist_android.yml producer
        # workflow) and cmake/heif.cmake now has an ANDROID branch that finds
        # and stages it -- the "no Android heif-dist exists" rationale this
        # comment used to record is stale and has been corrected. The
        # configure log is captured + grepped below (positive assertion) to
        # prove HEIF was actually linked, not just requested.
        #
        # -DCEYX_ENABLE_JXL=OFF remains UNCHANGED (contract-ci-completion-round.md
        # AC7, per team-lead ruling 2026-09-01): unlike heif-dist-android,
        # native/third_party/libjxl-dist-android-arm64-v8a has ONLY a
        # PROVENANCE.md committed -- `git ls-files` on that directory returns
        # exactly one path -- no lib/include archives were ever landed by a
        # producer run, so there is no dist to link against yet. Flipping this
        # flag ON today would not be a config mistake to fix in cmake, it
        # would fail for the true and separate reason "artifact missing";
        # escalated to the user as part of A-T8-FIX's report. The G1 assertion
        # below (unchanged) still names an accurate fact about a real state
        # and must not be touched until that separate ruling lands.
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          # round-5-review BLOCKER fix: the explicit `shell: bash` key above is
          # what supplies pipefail — GitHub's default for a keyless `run:` is
          # `bash -e {0}` (NO pipefail), which silently makes `rc=$?` below
          # capture tee's exit code (always 0), not the build's. Removing this
          # key re-inverts the gate; do not remove it.
          #
          # With `shell: bash` in effect: `set +e` below disables errexit but
          # pipefail stays active, so `$?` after the pipe reflects the PYTHON
          # process's exit code, not tee's — ${PIPESTATUS[0]} is deliberately
          # NOT used here (08-23 lesson: it does not reliably expand in every
          # shell).
          set +e
          python3 native/scripts/build_native_watchdog.py \
            --platform android \
            --target dng_decoder_native \
            --android-ndk "${ANDROID_NDK_HOME}" \
            --cmake-arg=-DDNG_ENABLE_HEIF=ON \
            --cmake-arg=-DCEYX_ENABLE_JXL=OFF \
            --idle-timeout-sec 180 2>&1 | tee android_build.log
          rc=$?
          set -e
          echo "BUILD_RC=${rc}"
          exit "${rc}"

      - name: Assert HEIF was actually linked, not silently degraded (A-T8-FIX)
        # Positive assertion, mirroring the G1 pattern below but inverted: a
        # missing/mismatched Android heif-dist must fail configure LOUDLY
        # (cmake/heif.cmake's ANDROID branch uses message(FATAL_ERROR), so a
        # broken dist already fails the build step above) -- this assertion
        # additionally proves the SUCCESS path actually took the HEIF-enabled
        # branch and not some other silently-OK-looking log shape.
        shell: bash
        run: |
          set +e
          grep -q "HEIF: libheif .* + libde265 .* (dynamic)" android_build.log
          rc=$?
          set -e
          echo "ASSERT HEIF enabled RC=${rc}"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::configure log does not show the expected 'HEIF: libheif ... + libde265 ... (dynamic)' line from cmake/heif.cmake; -DDNG_ENABLE_HEIF=ON above may not have taken effect, or the Android dist was not found." >&2
            exit 1
          fi

      - name: Assert JXL was explicitly disabled, not silently degraded (G1)
        shell: bash
        run: |
          set +e
          grep -q "JXL: disabled (CEYX_ENABLE_JXL=OFF)" android_build.log
          rc=$?
          set -e
          echo "ASSERT JXL explicit-OFF RC=${rc}"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::configure log does not show the expected 'JXL: disabled (CEYX_ENABLE_JXL=OFF)' line from cmake/jxl.cmake; the -DCEYX_ENABLE_JXL=OFF flag above may not have taken effect." >&2
            exit 1
          fi

      - name: Stage native artifacts
        # A-T8-FIX: multi-.so packaging. cmake/heif.cmake's ANDROID branches
        # (HEIF companions + the unconditional libc++_shared.so block) stage
        # every companion .so NEXT TO libdng_decoder_native.so in the build
        # dir (same directory the POST_BUILD copy_if_different commands
        # target), so a single glob on *.so here collects the whole atomic
        # set with no separately-maintained file list to drift out of sync.
        run: |
          mkdir -p "${ARTIFACT_DIR}/native"
          find "${NATIVE_DIR}/build-android/android-arm64" -maxdepth 1 \
            -name "*.so" \
            -exec cp {} "${ARTIFACT_DIR}/native/" \; || true
          ls -la "${ARTIFACT_DIR}/native" || true

      - name: Fail if the required Android .so set is incomplete (A-T8-FIX atomic group)
        # Required today: the decoder, its HEIF companions (DNG_ENABLE_HEIF=ON
        # above), and libc++_shared.so (ANDROID_STL=c++_shared, staged
        # unconditionally). Mirrors publish_release.py's ATOMIC_REQUIRED_FILES
        # pattern for windows/linux -- keep this list and any future Android
        # entry added there in sync.
        run: |
          shopt -s nullglob
          libs=("${ARTIFACT_DIR}"/native/libdng_decoder_native*.so)
          if [ ${#libs[@]} -eq 0 ]; then
            echo "::error::No libdng_decoder_native*.so found in ${ARTIFACT_DIR}/native; Stage 2 build did not emit the expected artifact." >&2
            exit 1
          fi
          required=("libheif.so" "libde265.so" "libc++_shared.so")
          missing=""
          for f in "${required[@]}"; do
            if [ ! -f "${ARTIFACT_DIR}/native/${f}" ]; then
              missing="${missing} ${f}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::missing required companion .so(s) in ${ARTIFACT_DIR}/native:${missing} — the Android atomic group (decoder + HEIF companions + libc++_shared) is incomplete." >&2
            exit 1
          fi

      # G6 fix (round-5 gap closure, task #9): this .so is a target-arm64 ELF
      # cross-compiled on an x86_64 host, so the NDK's own llvm-nm (not host
      # binutils) is used to read its dynamic symbol table — same toolchain
      # already set up for the Stage 2 cross-compile above (ANDROID_NDK_HOME),
      # matching this repo's convention of using the platform's own tool
      # rather than assuming host tooling parses foreign-arch ELF correctly.
      # Prior to this fix android_build.yml had ZERO symbol-level verification
      # — only a file-existence check — the thinnest-verified platform of the
      # four per r5-rel-coverage-matrix.md's G6 finding. dng_decode_and_process
      # is the POSITIVE CONTROL (exported since the first Android build); its
      # absence means this check itself is broken, not that the build
      # regressed. Output to a FILE, then grepped — never `nm | grep -q`
      # (pipefail would turn a SIGPIPE on a successful match into a false
      # failure).
      - name: Assert required FFI exports present in Android .so (G6)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          SO=$(ls "${ARTIFACT_DIR}"/native/libdng_decoder_native*.so | head -n 1)
          echo "Checking: ${SO}"
          LLVM_NM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          if [ ! -x "${LLVM_NM}" ]; then
            echo "::error::llvm-nm not found at ${LLVM_NM} — NDK layout may have changed (r27c expected)." >&2
            exit 1
          fi
          set +e
          "${LLVM_NM}" -D "${SO}" > android_so_dynsyms.txt 2>&1
          rc=$?
          set -e
          echo "NM_RC=${rc}"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::llvm-nm -D failed on ${SO} (rc=${rc}); export presence is UNVERIFIED, refusing to publish." >&2
            cat android_so_dynsyms.txt || true
            exit 1
          fi
          missing=""
          for sym in dng_decode_and_process ceyx_encode_jpeg_rgba8; do
            set +e
            grep -q "${sym}" android_so_dynsyms.txt
            rc=$?
            set -e
            echo "RC=${rc} (${sym})"
            if [ "${rc}" -ne 0 ]; then
              missing="${missing} ${sym}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::missing exported symbol(s) in ${SO}:${missing} — the .so does not export the FFI surface Dart looks up." >&2
            exit 1
          fi

      # A-T8-FIX: prove libc++_shared.so is a real, satisfied runtime
      # dependency of the decoder -- not just a file that happens to be
      # present in the artifact dir. Capture `llvm-readelf -d` to a FILE
      # first, then grep the file (2026-08-28 lesson: under `set -euo
      # pipefail`, `readelf -d ... | grep -q PATTERN` returns 141 and
      # INVERTS the verdict when the pattern IS found, because grep exits
      # early and readelf takes SIGPIPE -- never pipe straight into grep -q
      # here).
      - name: Assert decoder DT_NEEDED lists libc++_shared.so (A-T8-FIX libc++_shared handling)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          SO=$(ls "${ARTIFACT_DIR}"/native/libdng_decoder_native*.so | head -n 1)
          LLVM_READELF="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          if [ ! -x "${LLVM_READELF}" ]; then
            echo "::error::llvm-readelf not found at ${LLVM_READELF} — NDK layout may have changed (r27c expected)." >&2
            exit 1
          fi
          set +e
          "${LLVM_READELF}" -d "${SO}" > android_decoder_dynamic.txt 2>&1
          rc=$?
          set -e
          echo "READELF_RC=${rc}"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::llvm-readelf -d failed on ${SO} (rc=${rc}); DT_NEEDED is UNVERIFIED, refusing to publish." >&2
            cat android_decoder_dynamic.txt || true
            exit 1
          fi
          set +e
          grep -q "libc++_shared.so" android_decoder_dynamic.txt
          rc=$?
          set -e
          echo "RC=${rc} (libc++_shared.so in DT_NEEDED)"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::${SO}'s DT_NEEDED does not list libc++_shared.so — ANDROID_STL=c++_shared expects this dependency; staging without an actual link-time need (or a build that silently dropped it) would ship a dead file." >&2
            cat android_decoder_dynamic.txt
            exit 1
          fi

      # Round 6, Plan B: this artifact name is also the release asset stem —
      # the publish job in build.yml packages `<artifact name>.tar.gz`
      # verbatim, so no rename step exists between here and the release. The
      # former "Name the release asset" + softprops/action-gh-release pair is
      # deleted; release attachment is the publish job's exclusive
      # responsibility (.github/CI-CONVENTIONS.md rule 3).
      #
      # UPDATED (A-T8-FIX, 2026-09-01): this leg still builds NO third-party
      # distribution of its own here (the heif-dist/libjxl-dist/libwebp-dist
      # committed trees are pre-built PRODUCER artifacts consumed by cmake,
      # not built by this job), but it now CONSUMES the committed heif-dist
      # and packages its runtime companions -- the artifact this step uploads
      # is the multi-.so atomic group (decoder + libheif.so + libde265.so +
      # libc++_shared.so), asserted complete by the "Fail if the required
      # Android .so set is incomplete" step above, not a single file. JXL
      # remains excluded (-DCEYX_ENABLE_JXL=OFF): no Android libjxl dist has
      # actually been committed yet (see the build step's comment above).
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: dng_decoder_native-android-arm64-v8a
          path: ${{ github.workspace }}/artifacts/native
          if-no-files-found: error
          retention-days: 7
