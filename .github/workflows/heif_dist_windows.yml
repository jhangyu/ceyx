name: HEIF dist (Windows)

# DISPATCH-ONLY BY DESIGN. This job builds the libheif/libde265 distribution
# that is then COMMITTED to native/third_party/heif-dist-windows/, exactly as
# the macOS dist is. It is not part of the per-commit Windows build: the dist
# is a pinned, reviewed input (upstream tarball + SHA-256 + a fixed flag set),
# and rebuilding it on every push would make the shipped bytes a moving target
# under an LGPL source-availability obligation.
#
# ci/** is included so the workflow can be verified from a bootstrap branch:
# a workflow file only becomes dispatchable once it exists on a ref that runs it.
#
# Round 6 (Plan B): `workflow_call` was ADDED alongside the existing triggers so
# build.yml can invoke this leg on demand. workflow_dispatch is KEPT and remains
# the primary entry point — this workflow is the sole producer of the committed
# native/third_party/heif-dist-windows tree and must stay independently runnable
# by a human regenerating that tree under the LGPL source-availability
# obligation. It is deliberately NOT wired into build.yml's per-push platform
# matrix: rebuilding a pinned, reviewed, committed input on every push is
# exactly the "moving target" the paragraph above forbids.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "ci/**"
    paths:
      # The Python carrier now builds this dist, so its files must be able to
      # TRIGGER the job that proves them. Listing only the retired shell script
      # would leave every carrier change untested on Windows while the workflow
      # still looked healthy -- the same trigger-coverage gap S2 fixed for the
      # vcpkg files in round 3.
      - "native/scripts/deps/**"
      - "native/scripts/build_deps.py"
      - "native/deps/manifest.toml"
      # S3 (round-4 parking-lot): arch_map.toml drives the carrier's
      # platform/arch vocabulary (render.py resolves cmake args through it),
      # so a manifest-affecting change to it must trigger this leg the same
      # way manifest.toml already does -- otherwise an arch_map edit could
      # silently desync the Windows dist from what the carrier now renders.
      - "native/deps/arch_map.toml"
      # SF3 (round-3 parking-lot): this leg installs de265 + aom via vcpkg
      # (see the "vcpkg install de265 + aom" step below), so a change to the
      # vcpkg manifest/portfiles must trigger it -- otherwise a vcpkg.json or
      # port edit could silently desync the Windows HEIF dist the same way an
      # untriggered manifest.toml change would.
      - "native/vcpkg/**"
      - ".github/workflows/heif_dist_windows.yml"
      # WI-37 (pyci python-ization campaign, push 8b): the steps below now
      # dispatch through native/scripts/ci.py's `vcpkg`/`dist-build`/
      # `dist-list`/`provision` commands (WI-29/WI-30), so a change to any of
      # those modules must trigger this leg the same way a carrier change
      # already does.
      - "native/scripts/ci.py"
      - "native/scripts/ci/vcpkg.py"
      - "native/scripts/ci/dist_build.py"
      - "native/scripts/ci/provision.py"
      - "native/scripts/ci/windows_toolchain.py"

concurrency:
  group: heif-dist-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-heif-dist:
    name: libheif + libde265 + kvazaar + aom dist (windows x86_64, clang-cl, encode+decode)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # D1-a: aom reaches the Windows HEIF build via vcpkg, same mechanism as
      # macos_build.yml/linux_build.yml (D5). VCPKG_BASELINE is NOT set here
      # (ruling 5, 2026-09-01): native/vcpkg/vcpkg.json's "builtin-baseline"
      # is the ONLY authority, derived at runtime by the "Derive vcpkg
      # baseline from vcpkg.json" step below -- see
      # native/deps/manifest.toml [component.aom].
      VCPKG_TRIPLET: x64-windows-heif
    steps:
      # MUST run BEFORE actions/checkout, same reason as windows_build.yml:
      # Git for Windows ships core.autocrlf=true system-wide, and a checkout
      # done before this writes shell scripts with CRLF, which Git-Bash then
      # fails to execute with an opaque error.
      #
      # WI-37: re-classified, NOT migrated. There is no checkout yet at this
      # point in the job, so `python3 native/scripts/ci.py ...` has nothing
      # to invoke -- this step stays raw shell permanently, same class as
      # C-G14's other pre-checkout entries (windows_build.yml's twin).
      - name: Force LF line endings for all git operations
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          echo "core.autocrlf=$(git config --global core.autocrlf)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ruling 5 (2026-09-01): native/vcpkg/vcpkg.json's "builtin-baseline" is
      # the ONLY authority for this SHA; every workflow reads it here instead
      # of hardcoding its own copy that can drift.
      #
      # WI-37 interpreter-ordering ruling (routed by impl-pyci-23/WI-30):
      # this step used to run BEFORE "Set up Python" (pre-migration :86-90),
      # on whatever Python the runner image happened to preinstall. Moved to
      # AFTER "Set up Python" here -- nothing in this step depends on running
      # before the interpreter is pinned (unlike "Force LF line endings"
      # above, which has a real, load-bearing reason to precede checkout),
      # so leaving it on an unpinned interpreter was an accident of original
      # step order, not a requirement. Running it on the pinned 3.11 closes
      # that gap rather than documenting it as accepted.
      - name: Derive vcpkg baseline from vcpkg.json
        shell: bash
        run: python3 native/scripts/ci.py vcpkg baseline --manifest native/vcpkg/vcpkg.json --github-env "$GITHUB_ENV"

      # CMake ships with the runner image; Ninja does not reliably. pip's ninja
      # wheel is a pinned, deterministic way to get it on PATH without choco.
      - name: Install Ninja
        shell: bash
        run: python3 native/scripts/ci.py provision ninja

      # Ninja + clang-cl need the MSVC headers/libs/linker on PATH, INCLUDE and
      # LIB; this action is CI's equivalent of vcvars64.bat.
      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate clang-cl
        shell: bash
        run: python3 native/scripts/ci.py provision locate-clang-cl --github-path "$GITHUB_PATH"

      # D1-a: bootstrap vcpkg at the pinned baseline, same shape as
      # macos_build.yml/linux_build.yml (bootstrap-vcpkg.sh runs under
      # Git-Bash on windows-latest exactly as it does under native bash on
      # macOS/Linux). MSYS_NO_PATHCONV=1 disables Git-Bash's POSIX-path
      # auto-conversion for these two steps only (R4: MSYS argv translation is
      # one of the four independent path-rewriting triggers this repo has hit
      # before) -- neither vcpkg's own CLI nor its portfiles expect that
      # conversion, and $RUNNER_TEMP/$GITHUB_WORKSPACE are already
      # Windows-native paths here.
      - name: Bootstrap vcpkg at the pinned baseline (D1-a)
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: python3 native/scripts/ci.py vcpkg bootstrap --root "$RUNNER_TEMP" --baseline "$VCPKG_BASELINE"

      # --feature de265 --feature aom mirrors linux_build.yml/macos_build.yml's
      # feature set for this dist: de265 for licence vendoring's copyright
      # source (win_heif_dist.py still self-builds libde265's DLL from source,
      # per [component.libde265.source.windows]'s three durable blockers, but
      # vendor_licences() re-fetches its tarball independently of vcpkg) and
      # aom for the static archive win_heif_dist.build_aom() copies out of the
      # install prefix below.
      - name: vcpkg install de265 + aom (x64-windows-heif)
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: python3 native/scripts/ci.py vcpkg install --manifest-root "$GITHUB_WORKSPACE/native/vcpkg" --install-root "$RUNNER_TEMP/vcpkg-installed" --triplet "$VCPKG_TRIPLET" --feature de265 --feature aom --rc-marker VCPKG_INSTALL_RC

      # Assert BEFORE the carrier consumes it: a triplet mistake here would
      # otherwise surface only as build_aom's much-later "aom.lib missing"
      # failure, three steps away from the actual cause.
      - name: Assert the vcpkg aom artefact (static)
        shell: bash
        run: python3 native/scripts/ci.py vcpkg assert-aom-artifact --prefix "$RUNNER_TEMP/vcpkg-installed/$VCPKG_TRIPLET"

      # Consumed by win_heif_dist.build_aom() (copies lib/aom.lib +
      # include/aom out of this prefix -- aom's resolved source kind is
      # "registry" on every platform, so execute.acquire() never builds it)
      # and by win_heif_dist.vendor_licences() (share/aom/copyright, incl.
      # PATENTS). GITHUB_ENV rather than a step-local `env:` because both
      # consumers run inside the LATER "Build the HEIF dist" step.
      - name: Export CEYX_VCPKG_PREFIX for the carrier
        shell: bash
        run: python3 native/scripts/ci.py vcpkg export-prefix --prefix "$RUNNER_TEMP/vcpkg-installed/$VCPKG_TRIPLET" --github-env "$GITHUB_ENV"

      # R4: built by the PYTHON CARRIER, not by build_heif_dist_windows.sh.
      #
      # `shell: pwsh` rather than bash is the substantive change here, not a
      # style preference -- PRESERVED across the WI-29/WI-37 migration for
      # the same reason it was chosen originally. Under Git-Bash every
      # argument that looks like a path is eligible for MSYS path rewriting
      # -- which is how an absolute workspace path became `\d\a\...` on this
      # project before -- and Git-Bash can also put an MSYS Python on PATH,
      # whose sys.platform is "msys" and whose entire purpose is POSIX
      # emulation. deps/run.py refuses to run under that interpreter by
      # design. pwsh + native Windows Python means argv reaches
      # CreateProcessW unmodified, with no shell in between to reinterpret
      # the --dist value. `python` (not `python3`) matches the original
      # pwsh invocation -- unlike the bash steps above, this runner's pwsh
      # session was never verified to resolve `python3`.
      #
      # RC handling is now internal to native/scripts/ci/dist_build.py
      # (`report.marker(rc_marker, rc)` then `return rc`, propagated through
      # `sys.exit(main())`) -- the step no longer needs its own
      # `$LASTEXITCODE`/`Write-Host`/`exit` dance; `--rc-marker
      # HEIF_DIST_WINDOWS_RC` reproduces the exact marker name the
      # pre-migration step printed.
      # Invoked through the SINGLE CARRIER ENTRY POINT (build_deps.py, via
      # dist_build.py), which is the agreed team contract.
      - name: Build the HEIF dist (Python carrier)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: python native/scripts/ci.py dist-build --component heif-stack --platform windows --arch x86_64 --dist "${{ github.workspace }}/native/third_party/heif-dist-windows" --rc-marker HEIF_DIST_WINDOWS_RC

      # Complete listing, deliberately unfiltered. A '*.dll'-filtered listing
      # looks like a full inventory while silently omitting the import
      # libraries and headers -- the same instrument failure the zlib step in
      # windows_build.yml documents.
      - name: List the produced dist (complete)
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 native/scripts/ci.py dist-list --dist native/third_party/heif-dist-windows

      # Canonical artifact name <component>-<platform>-<arch> (round 6); the
      # arch suffix was previously implicit. The PACKAGED DIRECTORY keeps its
      # committed path (native/third_party/heif-dist-windows) — that is a
      # tracked source path consumed by cmake/heif.cmake, not an artifact name,
      # and renaming it is out of scope here.
      - name: Upload the dist
        uses: actions/upload-artifact@v4
        with:
          name: heif-dist-windows-x86_64
          path: ${{ github.workspace }}/native/third_party/heif-dist-windows
          if-no-files-found: error
          retention-days: 7
