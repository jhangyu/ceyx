name: libjxl dist (Windows)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "ci/**"
    paths:
      - "native/scripts/deps/**"
      - "native/scripts/build_deps.py"
      - ".github/workflows/jxl_dist_windows.yml"

concurrency:
  group: jxl-dist-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-jxl-dist:
    name: libjxl dist (windows x86_64, clang-cl, static, encode+decode)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Force LF line endings for all git operations
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          echo "core.autocrlf=$(git config --global core.autocrlf)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ninja
        run: python native/scripts/ci.py provision ninja

      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate clang-cl
        shell: bash
        run: python3 native/scripts/ci.py provision locate-clang-cl --github-path "$GITHUB_PATH"

      - name: Build the libjxl dist (Python carrier)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          python native/scripts/ci.py dist-build --component jxl-stack --platform windows --arch x86_64 --dist "${{ github.workspace }}/native/third_party/libjxl-dist-windows" --rc-marker JXL_DIST_WINDOWS_RC

      - name: List the produced dist (complete)
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 native/scripts/ci.py dist-list --dist native/third_party/libjxl-dist-windows

      - name: Upload the dist
        uses: actions/upload-artifact@v4
        with:
          name: libjxl-dist-windows-x86_64
          path: ${{ github.workspace }}/native/third_party/libjxl-dist-windows
          if-no-files-found: error
          retention-days: 7
