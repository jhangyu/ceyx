name: HEIF Functional Capability Probe (D4/R-7)

# First cloud execution of native/scripts/deps/probe/probe_codecs.c
# (docs/logs/2026-08-30/Spec_build_rewrite.md §5.6). The file has never been
# compiled or run anywhere before this workflow (R-7 requirement, round-5
# contract AC4). It links against the COMMITTED macOS HEIF dist
# (native/third_party/heif-dist, arm64, built with kvazaar HEVC encoder +
# aom AV1 encoder/decoder + libde265 HEVC decoder per Spec §3.2), so on a
# clean checkout with no other build step it should report all four
# capabilities present (exit code 0 — see probe_codecs.c's bit convention).
#
# Exit-code discipline (2026-08-23 lesson): the probe's own exit code is
# captured as RC=$? IMMEDIATELY after the run, inside this log, and printed
# verbatim — never inferred from a workflow-level job conclusion.
on:
  push:
    branches: [main, "ci/**", "round5-carrier"]
    paths:
      - "native/scripts/deps/probe/**"
      - "native/third_party/heif-dist/**"
      - ".github/workflows/heif_functional_probe.yml"
  pull_request:
    branches: [main]
    paths:
      - "native/scripts/deps/probe/**"
      - "native/third_party/heif-dist/**"
      - ".github/workflows/heif_functional_probe.yml"
  workflow_dispatch:

concurrency:
  group: heif-functional-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Compile + run probe_codecs.c against committed macOS dist
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify committed dist is present (arm64)
        run: |
          set -e
          DIST="$GITHUB_WORKSPACE/native/third_party/heif-dist"
          test -f "$DIST/include/libheif/heif.h" \
            || { echo "FAIL: $DIST/include/libheif/heif.h absent"; exit 1; }
          test -f "$DIST/lib/libheif.1.dylib" \
            || { echo "FAIL: $DIST/lib/libheif.1.dylib absent"; exit 1; }
          archs=$(lipo -archs "$DIST/lib/libheif.1.dylib")
          echo "libheif.1.dylib archs: ${archs}"
          echo "${archs}" | grep -qw "arm64" \
            || { echo "FAIL: committed dist is not arm64 (macos-14 runner is arm64)"; exit 1; }

      - name: Compile probe_codecs.c
        run: |
          set -e
          DIST="$GITHUB_WORKSPACE/native/third_party/heif-dist"
          mkdir -p "$GITHUB_WORKSPACE/native/scripts/deps/probe/build"
          clang \
            -I"$DIST/include" \
            -L"$DIST/lib" \
            -Wl,-rpath,"$DIST/lib" \
            -o "$GITHUB_WORKSPACE/native/scripts/deps/probe/build/probe_codecs" \
            "$GITHUB_WORKSPACE/native/scripts/deps/probe/probe_codecs.c" \
            -lheif
          file "$GITHUB_WORKSPACE/native/scripts/deps/probe/build/probe_codecs"

      - name: Run probe_codecs and self-capture exit code (RC=$?)
        run: |
          set +e
          "$GITHUB_WORKSPACE/native/scripts/deps/probe/build/probe_codecs"
          RC=$?
          echo "RC=${RC}"
          echo "PROBE_RC=${RC}" >> "$GITHUB_STEP_SUMMARY"
          # Bit convention (probe_codecs.c): 0=HEVC-ENC set,1=AV1-ENC set,
          # 2=HEVC-DEC set,3=AV1-DEC set; a set bit means the capability is
          # ABSENT. The committed dist ships all four (Spec §3.2), so this
          # step fails loudly (not silently) if any bit is unexpectedly set.
          if [ "${RC}" -ne 0 ]; then
            echo "::error::probe_codecs exited ${RC} (nonzero bits = missing capabilities); see bit convention comment in probe_codecs.c"
            exit "${RC}"
          fi
          echo "All four capabilities present (A-CAP-HEVC-ENC, A-CAP-AV1-ENC, A-CAP-HEVC-DEC, A-CAP-AV1-DEC): RC=0"
