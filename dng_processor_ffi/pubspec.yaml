name: dng_processor_ffi
description: >-
  Bundles the prebuilt dng_decoder_native library into host apps so RAW/DNG
  decoding works without a dev-machine CMake build tree.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        ffiPlugin: true
      android:
        ffiPlugin: true
